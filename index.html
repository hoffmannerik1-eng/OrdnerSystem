<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrdnerSystem</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 90%;
            max-width: 450px;
            background: rgba(20, 25, 35, 0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 7px 0;
            border: 0;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #fehler {
            color: #ff5555;
        }

        #admin {
            display: none;
        }
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div class="box" id="login">
        <h1>🔐 OrdnerSystem</h1>

        <input id="email" type="email" placeholder="E-Mail">
        <input id="passwort" type="password" placeholder="Passwort">

        <button onclick="anmelden()">ANMELDEN</button>

        <p id="fehler"></p>
    </div>


    <!-- ADMIN-BEREICH -->
    <div class="box" id="admin">
        <h1>⚙️ Admin-Menü</h1>

        <p>Du bist erfolgreich angemeldet.</p>

        <button onclick="abmelden()">ABMELDEN</button>
    </div>


    <script type="module">

        import { initializeApp } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


        const firebaseConfig = {
            apiKey: "AIzaSyAYD56NLKpXVGAZ31807UQh9sSB-kncBjk",
            authDomain: "ordnersystem-1352a.firebaseapp.com",
            projectId: "ordnersystem-1352a",
            storageBucket: "ordnersystem-1352a.firebasestorage.app",
            messagingSenderId: "39473536985",
            appId: "1:39473536985:web:7dae48028c28dabc6a03c8"
        };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);


        window.anmelden = async function () {

            const email =
                document.getElementById("email").value;

            const passwort =
                document.getElementById("passwort").value;

            const fehler =
                document.getElementById("fehler");

            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    passwort
                );

                fehler.textContent = "";

            } catch (error) {

                fehler.textContent =
                    "E-Mail oder Passwort falsch.";

            }
        };


        window.abmelden = async function () {
            await signOut(auth);
        };


        onAuthStateChanged(auth, (user) => {

            if (user) {

                document.getElementById("login").style.display = "none";
                document.getElementById("admin").style.display = "block";

            } else {

                document.getElementById("login").style.display = "block";
                document.getElementById("admin").style.display = "none";

            }

        });

    </script>

</body>
</html>
