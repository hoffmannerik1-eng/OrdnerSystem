<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrdnerSystem</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

header {
    height: 65px;
    background: white;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.profile {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #e8e8e8;
    display: flex;
    align-items: center;
    justify-content: center;
}

.layout {
    display: flex;
    min-height: calc(100vh - 65px);
}

.sidebar {
    width: 240px;
    background: white;
    border-right: 1px solid #ddd;
    padding: 20px 12px;
}

.sidebar h3 {
    font-size: 12px;
    color: #888;
    margin: 18px 10px 8px;
    text-transform: uppercase;
}

.nav-button {
    width: 100%;
    border: none;
    background: transparent;
    text-align: left;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

.nav-button:hover {
    background: #f0f1f3;
}

.nav-button.active {
    background: #e9eefc;
    color: #3157d5;
    font-weight: bold;
}

main {
    flex: 1;
    padding: 30px;
    overflow: auto;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.page-header h1 {
    margin: 0;
    font-size: 28px;
}

button.primary {
    border: none;
    background: #3157d5;
    color: white;
    padding: 11px 17px;
    border-radius: 8px;
    cursor: pointer;
}

button.primary:hover {
    background: #2447bc;
}

.search {
    width: 100%;
    max-width: 500px;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-bottom: 20px;
}

.folder-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 18px;
}

.folder {
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: 0.15s;
}

.folder:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.folder-icon {
    font-size: 40px;
    margin-bottom: 12px;
}

.folder h3 {
    margin: 0 0 5px;
}

.folder p {
    margin: 0;
    color: #888;
    font-size: 14px;
}

.empty {
    background: white;
    border: 1px dashed #ccc;
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    color: #888;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal.hidden {
    display: none;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 500px;
    border-radius: 14px;
    padding: 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,.2);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h2 {
    margin: 0;
}

.close {
    border: none;
    background: transparent;
    font-size: 28px;
    cursor: pointer;
    color: #666;
}

.form-group {
    margin-top: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

.form-group input {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

.modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 25px;
}

.cancel {
    border: 1px solid #ccc;
    background: white;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
}

/* DARK MODE */

body.dark {
    background: #18191c;
    color: white;
}

body.dark header,
body.dark .sidebar,
body.dark .folder,
body.dark .empty,
body.dark .modal-box {
    background: #24262a;
    border-color: #3a3d42;
}

body.dark header {
    border-bottom-color: #3a3d42;
}

body.dark .sidebar {
    border-right-color: #3a3d42;
}

body.dark .nav-button {
    color: white;
}

body.dark .nav-button:hover {
    background: #303338;
}

body.dark .nav-button.active {
    background: #303d68;
    color: #8fa8ff;
}

body.dark .folder:hover {
    box-shadow: 0 5px 20px rgba(0,0,0,.3);
}

body.dark .form-group input {
    background: #18191c;
    color: white;
    border-color: #444;
}

body.dark .cancel {
    background: #24262a;
    color: white;
    border-color: #555;
}

/* MOBILE */

@media (max-width: 700px) {

    .layout {
        display: block;
    }

    .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #ddd;
        padding: 8px;
    }

    .sidebar h3 {
        display: none;
    }

    .nav-button {
        width: auto;
        display: inline-block;
        margin: 2px;
    }

    main {
        padding: 18px;
    }

    .page-header {
        display: block;
    }

    .page-header button {
        margin-top: 15px;
    }

    .folder-grid {
        grid-template-columns: 1fr 1fr;
    }
}

@media (max-width: 430px) {

    .folder-grid {
        grid-template-columns: 1fr;
    }

    header {
        padding: 0 15px;
    }

    main {
        padding: 14px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">📁 OrdnerSystem</div>

    <div class="profile">
        <span>Erik</span>
        <div class="avatar">E</div>
    </div>
</header>

<div class="layout">

    <aside class="sidebar">

        <h3>Ordner</h3>

        <button class="nav-button active" onclick="showPage('alleOrdner', this)">
            📁 Alle Ordner
        </button>

        <button class="nav-button" onclick="showPage('letzterScan', this)">
            📱 Letzter Scan
        </button>

        <h3>Kategorien</h3>

        <button class="nav-button" onclick="showCategory('Anwälte')">
            ⚖️ Anwälte
        </button>

        <button class="nav-button" onclick="showCategory('Verträge')">
            📄 Verträge
        </button>

        <button class="nav-button" onclick="showCategory('Mandanten')">
            👥 Mandanten
        </button>

        <button class="nav-button" onclick="showCategory('Rechnungen')">
            🧾 Rechnungen
        </button>

        <button class="nav-button" onclick="showCategory('Finanzen')">
            💰 Finanzen
        </button>

        <button class="nav-button" onclick="showCategory('Steuern')">
            📊 Steuern
        </button>

        <button class="nav-button" onclick="showCategory('Personal')">
            👤 Personal
        </button>

        <button class="nav-button" onclick="showCategory('Sonstiges')">
            📦 Sonstiges
        </button>

        <button class="nav-button" onclick="showCategory('Archiv')">
            🗄️ Archiv
        </button>

        <h3>System</h3>

        <button class="nav-button" onclick="openSettings()">
            ⚙️ Einstellungen
        </button>

    </aside>

    <main>

        <!-- ALLE ORDNER -->

        <section id="alleOrdner" class="page active">

            <div class="page-header">
                <div>
                    <h1>Alle Ordner</h1>
                    <p>Alle Ordner des OrdnerSystems</p>
                </div>

                <button class="primary" onclick="openAddFolder()">
                    + Ordner hinzufügen
                </button>
            </div>

            <input
                class="search"
                id="search"
                placeholder="🔎 Ordner suchen..."
                oninput="searchFolders()"
            >

            <div id="folderGrid" class="folder-grid"></div>

        </section>


        <!-- LETZTER SCAN -->

        <section id="letzterScan" class="page">

            <div class="page-header">
                <div>
                    <h1>Letzter Scan</h1>
                    <p>Der zuletzt geöffnete NFC-Ordner</p>
                </div>
            </div>

            <div class="empty">
                📱<br><br>
                Noch kein NFC-Scan vorhanden.
            </div>

        </section>


        <!-- KATEGORIE -->

        <section id="categoryPage" class="page">

            <div class="page-header">

                <div>
                    <h1 id="categoryTitle">Kategorie</h1>
                    <p id="categoryDescription">
                        Ordner dieser Kategorie
                    </p>
                </div>

                <button class="primary" onclick="openAddFolder()">
                    + Ordner hinzufügen
                </button>

            </div>

            <div id="categoryGrid" class="folder-grid"></div>

        </section>


        <!-- EINSTELLUNGEN -->

        <section id="settings" class="page">

            <div class="page-header">
                <div>
                    <h1>Einstellungen</h1>
                    <p>OrdnerSystem Einstellungen</p>
                </div>
            </div>

            <div class="folder">

                <h3>Darstellung</h3>

                <br>

                <button class="primary" onclick="toggleTheme()">
                    ☀️ / 🌙 Hellmodus / Dunkelmodus
                </button>

            </div>

        </section>

    </main>

</div>


<!-- ORDNER HINZUFÜGEN -->

<div id="folderModal" class="modal hidden">

    <div class="modal-box">

        <div class="modal-header">

            <h2>Ordner hinzufügen</h2>

            <button class="close" onclick="closeModal('folderModal')">
                ×
            </button>

        </div>

        <div class="form-group">

            <label>Ordnername</label>

            <input
                id="folderName"
                type="text"
                placeholder="z. B. Müller GmbH"
            >

        </div>

        <div class="form-group">

            <label>Kategorie</label>

            <input
                id="folderCategory"
                type="text"
                placeholder="z. B. Mandanten"
            >

        </div>

        <div class="modal-buttons">

            <button
                class="cancel"
                onclick="closeModal('folderModal')"
            >
                Abbrechen
            </button>

            <button
                class="primary"
                onclick="addFolder()"
            >
                Hinzufügen
            </button>

        </div>

    </div>

</div>


<script>

let folders = [
    {
        name: "Mandanten",
        category: "Mandanten"
    },
    {
        name: "Verträge",
        category: "Verträge"
    },
    {
        name: "Rechnungen",
        category: "Rechnungen"
    },
    {
        name: "Finanzen",
        category: "Finanzen"
    },
    {
        name: "Steuern",
        category: "Steuern"
    },
    {
        name: "Personal",
        category: "Personal"
    }
];

let currentCategory = null;


/* SEITEN WECHSELN */

function showPage(id, button) {

    document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
    });

    const page = document.getElementById(id);

    if (page) {
        page.classList.add("active");
    }

    document.querySelectorAll(".nav-button").forEach(btn => {
        btn.classList.remove("active");
    });

    if (button) {
        button.classList.add("active");
    }

    if (id === "alleOrdner") {
        renderFolders();
    }
}


/* KATEGORIE ÖFFNEN */

function showCategory(category) {

    currentCategory = category;

    document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
    });

    document.getElementById("categoryPage").classList.add("active");

    document.getElementById("categoryTitle").textContent =
        "📁 " + category;

    document.getElementById("categoryDescription").textContent =
        "Ordner in der Kategorie " + category;

    renderCategory();

    document.querySelectorAll(".nav-button").forEach(btn => {
        btn.classList.remove("active");
    });
}


/* ORDNER ANZEIGEN */

function renderFolders() {

    const grid = document.getElementById("folderGrid");

    grid.innerHTML = "";

    if (folders.length === 0) {

        grid.innerHTML = `
            <div class="empty">
                Noch keine Ordner vorhanden.
            </div>
        `;

        return;
    }

    folders.forEach((folder, index) => {

        grid.innerHTML += createFolderHTML(folder, index);

    });
}


/* KATEGORIE ANZEIGEN */

function renderCategory() {

    const grid = document.getElementById("categoryGrid");

    grid.innerHTML = "";

    const filtered = folders.filter(folder =>
        folder.category.toLowerCase() === currentCategory.toLowerCase()
    );

    if (filtered.length === 0) {

        grid.innerHTML = `
            <div class="empty">
                📁<br><br>
                Noch keine Ordner in dieser Kategorie.
            </div>
        `;

        return;
    }

    filtered.forEach((folder, index) => {

        grid.innerHTML += createFolderHTML(folder, index);

    });
}


/* ORDNER HTML */

function createFolderHTML(folder, index) {

    return `
        <div
            class="folder"
            onclick="openFolder('${escapeHTML(folder.name)}')"
        >

            <div class="folder-icon">
                📁
            </div>

            <h3>${escapeHTML(folder.name)}</h3>

            <p>${escapeHTML(folder.category)}</p>

        </div>
    `;
}


/* ORDNER ÖFFNEN */

function openFolder(name) {

    alert(
        "Ordner „" +
        name +
        "“ wurde geöffnet."
    );
}


/* ORDNER HINZUFÜGEN */

function openAddFolder() {

    document.getElementById("folderName").value = "";

    document.getElementById("folderCategory").value =
        currentCategory || "";

    document
        .getElementById("folderModal")
        .classList.remove("hidden");
}


/* ORDNER SPEICHERN */

function addFolder() {

    const name =
        document.getElementById("folderName").value.trim();

    const category =
        document.getElementById("folderCategory").value.trim();

    if (!name) {

        alert("Bitte einen Ordnernamen eingeben.");

        return;
    }

    if (!category) {

        alert("Bitte eine Kategorie eingeben.");

        return;
    }

    folders.push({
        name: name,
        category: category
    });

    closeModal("folderModal");

    if (currentCategory) {

        renderCategory();

    } else {

        renderFolders();

    }
}


/* SUCHE */

function searchFolders() {

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase();

    const grid =
        document.getElementById("folderGrid");

    grid.innerHTML = "";

    folders
        .filter(folder =>
            folder.name.toLowerCase().includes(search) ||
            folder.category.toLowerCase().includes(search)
        )
        .forEach((folder, index) => {

            grid.innerHTML += createFolderHTML(folder, index);

        });
}


/* MODAL SCHLIESSEN */

function closeModal(id) {

    const modal = document.getElementById(id);

    if (modal) {
        modal.classList.add("hidden");
    }
}


/* EINSTELLUNGEN */

function openSettings() {

    document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
    });

    document
        .getElementById("settings")
        .classList.add("active");

    document.querySelectorAll(".nav-button").forEach(btn => {
        btn.classList.remove("active");
    });
}


/* DARK MODE */

function toggleTheme() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "darkMode",
        document.body.classList.contains("dark")
    );
}


/* ESC = FENSTER SCHLIESSEN */

document.addEventListener("keydown", function(event) {

    if (event.key !== "Escape") {
        return;
    }

    document
        .querySelectorAll(".modal")
        .forEach(modal => {

            modal.classList.add("hidden");

        });

});


/* KLICK AUF HINTERGRUND = SCHLIESSEN */

document.querySelectorAll(".modal").forEach(modal => {

    modal.addEventListener("click", function(event) {

        if (event.target === modal) {

            modal.classList.add("hidden");

        }

    });

});


/* HTML SICHER MACHEN */

function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* THEME LADEN */

if (localStorage.getItem("darkMode") === "true") {

    document.body.classList.add("dark");

}


/* START */

renderFolders();

</script>

</body>
</html>
