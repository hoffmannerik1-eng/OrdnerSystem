<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OrdnerSystem</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
}

button {
    border: none;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
    font-weight: bold;
}

.login-box {
    max-width: 400px;
    margin: 100px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 25px #0002;
}

.login-box h2 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 12px;
    margin: 7px 0;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
}

.login-btn {
    width: 100%;
    background: #2563eb;
    color: white;
    margin-top: 10px;
}

#app {
    display: none;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 15px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 10px #0001;
}

.stat-number {
    font-size: 30px;
    font-weight: bold;
}

.section {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 3px 10px #0001;
}

.person {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    margin: 10px 0;
    border-radius: 10px;
    color: white;
}

.green {
    background: #16a34a;
}

.red {
    background: #dc2626;
}

.gray {
    background: #64748b;
}

.person-info {
    font-size: 17px;
}

.person-small {
    font-size: 13px;
    opacity: 0.9;
}

.actions button {
    margin-left: 5px;
}

.admin-btn {
    background: #2563eb;
    color: white;
}

.delete-btn {
    background: #991b1b;
    color: white;
}

.free-btn {
    background: #f59e0b;
    color: white;
}

.take-btn {
    background: white;
    color: #111827;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #0008;
    justify-content: center;
    align-items: center;
    z-index: 100;
}

.modal-content {
    background: white;
    width: 95%;
    max-width: 450px;
    padding: 25px;
    border-radius: 15px;
}

.modal-content h2 {
    margin-top: 0;
}

.close-btn {
    background: #64748b;
    color: white;
}

.save-btn {
    background: #16a34a;
    color: white;
}

.scan-box {
    padding: 15px;
    background: #e2e8f0;
    border-radius: 10px;
}

.hidden {
    display: none;
}

@media(max-width:700px) {
    .stats {
        grid-template-columns: 1fr;
    }

    .person {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }

    .actions button {
        margin: 3px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

    <div class="login-box">

        <h2>OrdnerSystem</h2>

        <p>Bitte anmelden</p>

        <input
            id="loginEmail"
            type="email"
            placeholder="E-Mail"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Passwort"
        >

        <button
            class="login-btn"
            onclick="login()"
        >
            Anmelden
        </button>

        <p id="loginMessage"></p>

    </div>

</div>


<!-- APP -->

<div id="app">

<header>

    <h1>OrdnerSystem</h1>

    <div>

        <span id="userEmail"></span>

        <button
            onclick="logout()"
            style="margin-left:10px;background:#dc2626;color:white;"
        >
            Abmelden
        </button>

    </div>

</header>


<div class="container">


<!-- STATISTIK -->

<div class="stats">

    <div class="stat">

        <div>Alle Chips</div>

        <div
            id="totalCount"
            class="stat-number"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div>Grün</div>

        <div
            id="greenCount"
            class="stat-number"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div>Rot</div>

        <div
            id="redCount"
            class="stat-number"
        >
            0
        </div>

    </div>

</div>


<!-- ADMIN -->

<div
    id="adminPanel"
    class="section hidden"
>

    <h2>Administrator</h2>

    <button
        class="admin-btn"
        onclick="chipModalOeffnen()"
    >
        + Chip hinzufügen
    </button>

    <button
        class="admin-btn"
        onclick="userModalOeffnen()"
    >
        + Benutzer erstellen
    </button>

</div>


<!-- LETZTER SCAN -->

<div class="section">

    <h2>Letzter NFC-Scan</h2>

    <div
        id="lastScan"
        class="scan-box"
    >
        Noch kein Scan.
    </div>

</div>


<!-- ORDNER -->

<div class="section">

    <h2>Ordner / Chips</h2>

    <div id="ordnerListe">
        Laden...
    </div>

</div>


<!-- BENUTZER -->

<div
    id="usersSection"
    class="section hidden"
>

    <h2>Benutzer</h2>

    <div id="usersListe">
        Laden...
    </div>

</div>


</div>

</div>


<!-- CHIP MODAL -->

<div
    id="chipModal"
    class="modal"
>

<div class="modal-content">

    <h2 id="chipModalTitle">
        Chip hinzufügen
    </h2>

    <input
        id="chipName"
        placeholder="Name der Person"
    >

    <input
        id="chipId"
        placeholder="Chip-ID, z.B. 001"
    >

    <button
        class="save-btn"
        onclick="chipSpeichern()"
    >
        Speichern
    </button>

    <button
        class="close-btn"
        onclick="modalSchliessen('chipModal')"
    >
        Abbrechen
    </button>

</div>

</div>


<!-- USER MODAL -->

<div
    id="userModal"
    class="modal"
>

<div class="modal-content">

    <h2>Benutzer erstellen</h2>

    <input
        id="newUserName"
        placeholder="Name"
    >

    <input
        id="newUserEmail"
        type="email"
        placeholder="E-Mail"
    >

    <input
        id="newUserPassword"
        type="password"
        placeholder="Passwort"
    >

    <button
        class="save-btn"
        onclick="benutzerErstellen()"
    >
        Benutzer erstellen
    </button>

    <button
        class="close-btn"
        onclick="modalSchliessen('userModal')"
    >
        Abbrechen
    </button>

    <p id="userMessage"></p>

</div>

</div>


<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged,
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    doc,
    setDoc,
    updateDoc,
    deleteDoc,
    onSnapshot,
    getDocs,
    serverTimestamp,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey: "AIzaSyAYD56NLKpXVGAZ31807UQh9sSB-kncBjk",

    authDomain:
        "ordnersystem-1352a.firebaseapp.com",

    projectId:
        "ordnersystem-1352a",

    storageBucket:
        "ordnersystem-1352a.firebasestorage.app",

    messagingSenderId:
        "39473536985",

    appId:
        "1:39473536985:web:7dae48028c28dabc6a03c8"

};


/* =========================
   APP
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================
   ADMIN UID
========================= */

/*
   Dein erster Admin
*/

const ADMIN_UID_1 =
    "DQDq2eSl9HZbJJR6yiSgNm6YWaz1";


/*
   HIER später die UID
   des zweiten Admins eintragen.
*/

const ADMIN_UID_2 =
    "HIER-ZWEITE-ADMIN-UID-EINTRAGEN";


/* =========================
   VARIABLEN
========================= */

let aktuellerBenutzer = null;

let daten = [];

let bearbeitungsId = null;


/* =========================
   ADMIN PRÜFEN
========================= */

function istAdmin() {

    if (!aktuellerBenutzer)
        return false;

    return (
        aktuellerBenutzer.uid === ADMIN_UID_1 ||
        aktuellerBenutzer.uid === ADMIN_UID_2
    );
}


/* =========================
   LOGIN
========================= */

window.login = async function() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;


    if (!email || !password) {

        document.getElementById("loginMessage")
            .innerText =
            "Bitte E-Mail und Passwort eingeben.";

        return;
    }


    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }

    catch(error) {

        console.error(error);

        document.getElementById("loginMessage")
            .innerText =
            "Login fehlgeschlagen.";

    }

};


/* =========================
   LOGOUT
========================= */

window.logout = async function() {

    await signOut(auth);

};


/* =========================
   AUTH STATUS
========================= */

onAuthStateChanged(auth, async user => {

    aktuellerBenutzer = user;


    if (!user) {

        document.getElementById("loginScreen")
            .style.display = "block";

        document.getElementById("app")
            .style.display = "none";

        return;

    }


    document.getElementById("loginScreen")
        .style.display = "none";

    document.getElementById("app")
        .style.display = "block";


    document.getElementById("userEmail")
        .innerText = user.email;


    if (istAdmin()) {

        document.getElementById("adminPanel")
            .classList.remove("hidden");

        document.getElementById("usersSection")
            .classList.remove("hidden");

        benutzerLaden();

    }


    chipsLaden();

    scanLaden();


    /*
       NFC-Scan etwas später prüfen,
       damit die Chips geladen sind.
    */

    setTimeout(() => {

        nfcPruefen();

    }, 1000);

});


/* =========================
   CHIPS LADEN
========================= */

function chipsLaden() {

    const chipsRef =
        collection(db, "chips");


    onSnapshot(
        chipsRef,
        snapshot => {

            daten = [];

            snapshot.forEach(docSnap => {

                daten.push({

                    firestoreId: docSnap.id,

                    ...docSnap.data()

                });

            });


            anzeigenOrdner();

            statistik();

        },

        error => {

            console.error(
                "Fehler beim Laden:",
                error
            );

        }
    );

}


/* =========================
   ORDNER ANZEIGEN
========================= */

function anzeigenOrdner() {

    const liste =
        document.getElementById("ordnerListe");


    if (daten.length === 0) {

        liste.innerHTML =
            "<p>Noch keine Chips vorhanden.</p>";

        return;

    }


    liste.innerHTML = "";


    daten.forEach(person => {

        const rot =
            person.scanActive === true;


        const div =
            document.createElement("div");


        div.className =
            "person " +
            (rot ? "red" : "green");


        let statusText =
            rot ? "🔴 ROT" : "🟢 GRÜN";


        let besitzer = "";


        if (person.assignedEmail) {

            besitzer =
                `<div class="person-small">
                    Besitzer: ${person.assignedEmail}
                 </div>`;

        }
        else {

            besitzer =
                `<div class="person-small">
                    Noch frei
                 </div>`;

        }


        let scanInfo = "";


        if (person.lastScannedEmail) {

            scanInfo =
                `<div class="person-small">
                    Letzter Scan: ${person.lastScannedEmail}
                 </div>`;

        }


        let buttons = "";


        /*
           NORMALE BENUTZER
        */

        if (!istAdmin()) {

            if (!person.assignedTo) {

                buttons +=
                    `<button
                        class="take-btn"
                        onclick="chipUebernehmen('${person.firestoreId}')"
                    >
                        Chip übernehmen
                    </button>`;

            }


            if (
                person.assignedTo ===
                aktuellerBenutzer.uid
            ) {

                buttons +=
                    `<button
                        class="free-btn"
                        onclick="chipFreigeben('${person.firestoreId}')"
                    >
                        Chip freigeben
                    </button>`;

            }

        }


        /*
           ADMIN
        */

        if (istAdmin()) {

            buttons +=
                `<button
                    onclick="chipBearbeiten('${person.firestoreId}')"
                >
                    Bearbeiten
                </button>`;


            buttons +=
                `<button
                    class="delete-btn"
                    onclick="chipLoeschen('${person.firestoreId}')"
                >
                    Löschen
                </button>`;

        }


        div.innerHTML = `

            <div class="person-info">

                <strong>
                    ${person.name || "Unbekannt"}
                </strong>

                <div>
                    Chip: ${person.chipId}
                </div>

                <div>
                    ${statusText}
                </div>

                ${besitzer}

                ${scanInfo}

            </div>


            <div class="actions">

                ${buttons}

            </div>

        `;


        liste.appendChild(div);

    });

}


/* =========================
   STATISTIK
========================= */

function statistik() {

    let rot = 0;


    daten.forEach(chip => {

        if (chip.scanActive === true)
            rot++;

    });


    document.getElementById("totalCount")
        .innerText = daten.length;


    document.getElementById("redCount")
        .innerText = rot;


    document.getElementById("greenCount")
        .innerText =
        daten.length - rot;

}


/* =========================
   CHIP ÜBERNEHMEN
========================= */

window.chipUebernehmen = async function(id) {

    if (!aktuellerBenutzer)
        return;


    const chip =
        daten.find(x => x.firestoreId === id);


    if (!chip)
        return;


    if (chip.assignedTo) {

        alert(
            "Dieser Chip ist bereits vergeben."
        );

        return;

    }


    await updateDoc(
        doc(db, "chips", id),
        {

            assignedTo:
                aktuellerBenutzer.uid,

            assignedEmail:
                aktuellerBenutzer.email

        }
    );

};


/* =========================
   CHIP FREIGEBEN
========================= */

window.chipFreigeben = async function(id) {

    const chip =
        daten.find(x => x.firestoreId === id);


    if (!chip)
        return;


    if (
        chip.assignedTo !==
        aktuellerBenutzer.uid
    ) {

        alert(
            "Du besitzt diesen Chip nicht."
        );

        return;

    }


    await updateDoc(
        doc(db, "chips", id),
        {

            assignedTo: null,

            assignedEmail: ""

        }
    );

};


/* =========================
   CHIP MODAL
========================= */

window.chipModalOeffnen = function() {

    bearbeitungsId = null;

    document.getElementById("chipModalTitle")
        .innerText =
        "Chip hinzufügen";


    document.getElementById("chipName")
        .value = "";


    document.getElementById("chipId")
        .value = "";


    document.getElementById("chipModal")
        .style.display = "flex";

};


/* =========================
   CHIP SPEICHERN
========================= */

window.chipSpeichern = async function() {

    if (!istAdmin()) {

        alert("Keine Berechtigung.");

        return;

    }


    const name =
        document.getElementById("chipName")
            .value.trim();


    const chipId =
        document.getElementById("chipId")
            .value.trim();


    if (!name || !chipId) {

        alert(
            "Bitte Name und Chip-ID eingeben."
        );

        return;

    }


    if (bearbeitungsId) {

        await updateDoc(
            doc(db, "chips", bearbeitungsId),
            {

                name: name,

                chipId: chipId

            }
        );

    }

    else {

        await addDoc(
            collection(db, "chips"),
            {

                name: name,

                chipId: chipId,

                assignedTo: null,

                assignedEmail: "",

                scanActive: false,

                lastScannedBy: "",

                lastScannedEmail: "",

                lastScannedAt: null

            }
        );

    }


    modalSchliessen("chipModal");

};


/* =========================
   CHIP BEARBEITEN
========================= */

window.chipBearbeiten = function(id) {

    if (!istAdmin())
        return;


    const chip =
        daten.find(x => x.firestoreId === id);


    if (!chip)
        return;


    bearbeitungsId = id;


    document.getElementById("chipModalTitle")
        .innerText =
        "Chip bearbeiten";


    document.getElementById("chipName")
        .value =
        chip.name || "";


    document.getElementById("chipId")
        .value =
        chip.chipId || "";


    document.getElementById("chipModal")
        .style.display = "flex";

};


/* =========================
   CHIP LÖSCHEN
========================= */

window.chipLoeschen = async function(id) {

    if (!istAdmin())
        return;


    const chip =
        daten.find(x => x.firestoreId === id);


    if (!chip)
        return;


    if (
        !confirm(
            `Chip "${chip.name}" wirklich löschen?`
        )
    )
        return;


    await deleteDoc(
        doc(db, "chips", id)
    );

};


/* =========================
   MODAL SCHLIESSEN
========================= */

window.modalSchliessen = function(id) {

    document.getElementById(id)
        .style.display = "none";

};


/* =========================
   BENUTZER MODAL
========================= */

window.userModalOeffnen = function() {

    if (!istAdmin())
        return;


    document.getElementById("newUserName")
        .value = "";

    document.getElementById("newUserEmail")
        .value = "";

    document.getElementById("newUserPassword")
        .value = "";

    document.getElementById("userMessage")
        .innerText = "";


    document.getElementById("userModal")
        .style.display = "flex";

};


/* =========================
   BENUTZER ERSTELLEN
========================= */

window.benutzerErstellen = async function() {

    if (!istAdmin())
        return;


    const name =
        document.getElementById("newUserName")
            .value.trim();


    const email =
        document.getElementById("newUserEmail")
            .value.trim();


    const password =
        document.getElementById("newUserPassword")
            .value;


    if (!name || !email || !password) {

        document.getElementById("userMessage")
            .innerText =
            "Bitte alle Felder ausfüllen.";

        return;

    }


    if (password.length < 6) {

        document.getElementById("userMessage")
            .innerText =
            "Das Passwort muss mindestens 6 Zeichen haben.";

        return;

    }


    try {

        /*
           Zweite Auth-Instanz wäre für echte
           Admin-Erstellung ideal.

           Diese einfache Variante erstellt
           den Benutzer über Firebase Auth.
        */

        const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        await setDoc(
            doc(db, "users", result.user.uid),
            {

                name: name,

                email: email,

                role: "user",

                createdAt:
                    serverTimestamp()

            }
        );


        document.getElementById("userMessage")
            .innerText =
            "Benutzer erfolgreich erstellt.";


        /*
           Hinweis:
           Firebase meldet danach den neuen
           Benutzer an.
        */

    }

    catch(error) {

        console.error(error);

        document.getElementById("userMessage")
            .innerText =
            "Fehler: " + error.message;

    }

};


/* =========================
   BENUTZER LADEN
========================= */

function benutzerLaden() {

    const usersRef =
        collection(db, "users");


    onSnapshot(
        usersRef,
        snapshot => {

            const liste =
                document.getElementById("usersListe");


            liste.innerHTML = "";


            snapshot.forEach(userDoc => {

                const user =
                    userDoc.data();


                const div =
                    document.createElement("div");


                div.style.padding = "10px";

                div.style.borderBottom =
                    "1px solid #ddd";


                div.innerHTML = `

                    <strong>
                        ${user.name || "Unbekannt"}
                    </strong>

                    <br>

                    ${user.email || ""}

                    <br>

                    <small>
                        Rolle:
                        ${user.role || "user"}
                    </small>

                `;


                liste.appendChild(div);

            });

        }
    );

}


/* =========================
   SCAN LADEN
========================= */

function scanLaden() {

    const scanRef =
        doc(
            db,
            "system",
            "currentScan"
        );


    onSnapshot(
        scanRef,
        snapshot => {

            if (!snapshot.exists()) {

                document.getElementById("lastScan")
                    .innerText =
                    "Noch kein Scan.";

                return;

            }


            const scan =
                snapshot.data();


            document.getElementById("lastScan")
                .innerHTML = `

                    <strong>
                        Chip:
                        ${scan.chipId || "-"}
                    </strong>

                    <br>

                    Gescannt von:
                    ${scan.scannedEmail || "-"}

                    <br>

                    Status:
                    ${
                        scan.active
                        ? "🔴 ROT"
                        : "🟢 GRÜN"
                    }

                `;

        }
    );

}


/* =========================
   NFC
========================= */

async function nfcPruefen() {

    if (!aktuellerBenutzer)
        return;


    const url =
        window.location.href;


    const params =
        new URLSearchParams(
            window.location.search
        );


    const chipId =
        params.get("chip");


    if (!chipId)
        return;


    const chip =
        daten.find(
            x => String(x.chipId) ===
                 String(chipId)
        );


    if (!chip) {

        alert(
            "Unbekannter NFC-Chip: " +
            chipId
        );

        return;

    }


    /*
       ROT <-> GRÜN
    */

    const neuerStatus =
        chip.scanActive !== true;


    await updateDoc(
        doc(
            db,
            "chips",
            chip.firestoreId
        ),
        {

            scanActive:
                neuerStatus,

            lastScannedBy:
                aktuellerBenutzer.uid,

            lastScannedEmail:
                aktuellerBenutzer.email,

            lastScannedAt:
                serverTimestamp()

        }
    );


    await setDoc(
        doc(
            db,
            "system",
            "currentScan"
        ),
        {

            chipId:
                chip.chipId,

            scannedBy:
                aktuellerBenutzer.uid,

            scannedEmail:
                aktuellerBenutzer.email,

            active:
                neuerStatus,

            scannedAt:
                serverTimestamp()

        }
    );


    /*
       ?chip=001 aus URL entfernen
    */

    window.history.replaceState(
        {},
        document.title,
        window.location.pathname
    );

}
