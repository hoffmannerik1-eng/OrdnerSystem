<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OrdnerSystem</title>

<style>
* {
    box-sizing: border-box;
}
    body {
    background-image: url(IMG_4883.jpeg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f7;
    color: #111827;
}

/* LOGIN */

#loginScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 400px;
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 8px 30px #0002;
}

.login-box h1 {
    margin-top: 0;
    text-align: center;
}

input {
    width: 100%;
    padding: 13px;
    margin: 7px 0;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    font-size: 16px;
}

button {
    border: none;
    border-radius: 9px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: bold;
}

.login-button {
    width: 100%;
    background: #2563eb;
    color: white;
    margin-top: 10px;
}

.message {
    margin-top: 10px;
    color: #dc2626;
}

/* APP */

#app {
    display: none;
}

header {
    background: #111827;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

header h1 {
    margin: 0;
}

.logout-button {
    background: #dc2626;
    color: white;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 3px 12px #0001;
}

.stat-title {
    color: #64748b;
}

.stat-number {
    font-size: 32px;
    font-weight: bold;
    margin-top: 5px;
}

/* SECTIONS */

.section {
    background: white;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px #0001;
}

.section h2 {
    margin-top: 0;
}

/* BUTTONS */

.blue {
    background: #2563eb;
    color: white;
}

.green-button {
    background: #16a34a;
    color: white;
}

.orange {
    background: #f59e0b;
    color: white;
}

.red-button {
    background: #dc2626;
    color: white;
}

.gray-button {
    background: #64748b;
    color: white;
}

/* CHIPS */

.chip {
    color: white;
    padding: 16px;
    margin: 10px 0;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.chip-green {
    background: #16a34a;
}

.chip-red {
    background: #dc2626;
}

.chip-info {
    line-height: 1.5;
}

.chip-name {
    font-size: 19px;
    font-weight: bold;
}

.chip-small {
    font-size: 13px;
    opacity: 0.9;
}

.chip-buttons {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #0008;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 1000;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 450px;
    padding: 25px;
    border-radius: 16px;
}

.modal-content h2 {
    margin-top: 0;
}

.modal-buttons {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.modal-buttons button {
    flex: 1;
}

.hidden {
    display: none !important;
}

.scan-box {
    background: #f1f5f9;
    padding: 15px;
    border-radius: 10px;
}

.user-row {
    border-bottom: 1px solid #e2e8f0;
    padding: 12px 0;
}

@media(max-width:700px) {

    header {
        flex-direction: column;
        align-items: flex-start;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .chip {
        flex-direction: column;
        align-items: flex-start;
    }

    .chip-buttons {
        width: 100%;
    }

}
</style>
</head>

<body>


<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen">

    <div class="login-box">

        <h1>OrdnerSystem</h1>

        <p>Anmelden</p>

        <input
            id="loginEmail"
            type="email"
            autocomplete="email"
            placeholder="E-Mail"
        >

        <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="Passwort"
        >

        <button
            class="login-button"
            id="loginButton"
        >
            Anmelden
        </button>

        <div
            id="loginMessage"
            class="message"
        ></div>

    </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app">

<header>

    <h1>OrdnerSystem</h1>

    <div>

        <span id="userEmail"></span>

        <button
            class="logout-button"
            id="logoutButton"
        >
            Abmelden
        </button>

    </div>

</header>


<div class="container">


<!-- STATISTIK -->

<div class="stats">

    <div class="stat">

        <div class="stat-title">
            Alle Chips
        </div>

        <div
            id="totalCount"
            class="stat-number"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Grün
        </div>

        <div
            id="greenCount"
            class="stat-number"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Rot
        </div>

        <div
            id="redCount"
            class="stat-number"
        >
            0
        </div>

    </div>

</div>


<!-- ADMIN -->

<div
    id="adminPanel"
    class="section hidden"
>

    <h2>Administrator</h2>

    <button
        class="blue"
        id="addChipButton"
    >
        + Chip hinzufügen
    </button>

    <button
        class="blue"
        id="addUserButton"
    >
        + Benutzer erstellen
    </button>

</div>


<!-- LETZTER SCAN -->

<div class="section">

    <h2>Letzter NFC-Scan</h2>

    <div
        id="lastScan"
        class="scan-box"
    >
        Noch kein Scan.
    </div>

</div>


<!-- CHIPS -->

<div class="section">

    <h2>Ordner / Chips</h2>

    <div id="chipList">
        Laden...
    </div>

</div>


<!-- BENUTZER -->

<div
    id="usersSection"
    class="section hidden"
>

    <h2>Benutzerverwaltung</h2>

    <div id="usersList">
        Laden...
    </div>

</div>


</div>

</div>


<!-- =========================
     CHIP MODAL
========================= -->

<div
    id="chipModal"
    class="modal"
>

<div class="modal-content">

    <h2 id="chipModalTitle">
        Chip hinzufügen
    </h2>

    <input
        id="chipName"
        placeholder="Name der Person"
    >

    <input
        id="chipId"
        placeholder="Chip-ID, z.B. 001"
    >

    <div class="modal-buttons">

        <button
            class="green-button"
            id="saveChipButton"
        >
            Speichern
        </button>

        <button
            class="gray-button"
            id="closeChipButton"
        >
            Abbrechen
        </button>

    </div>

</div>

</div>


<!-- =========================
     USER MODAL
========================= -->

<div
    id="userModal"
    class="modal"
>

<div class="modal-content">

    <h2>Benutzer erstellen</h2>

    <input
        id="newUserName"
        placeholder="Name"
    >

    <input
        id="newUserEmail"
        type="email"
        placeholder="E-Mail"
    >

    <input
        id="newUserPassword"
        type="password"
        placeholder="Passwort"
    >

    <div class="modal-buttons">

        <button
            class="green-button"
            id="createUserButton"
        >
            Erstellen
        </button>

        <button
            class="gray-button"
            id="closeUserButton"
        >
            Abbrechen
        </button>

    </div>

    <div
        id="userMessage"
        class="message"
    ></div>

</div>

</div>


<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged,
    createUserWithEmailAndPassword,
    getIdToken
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    addDoc,
    setDoc,
    updateDoc,
    deleteDoc,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAYD56NLKpXVGAZ31807UQh9sSB-kncBjk",

    authDomain:
        "ordnersystem-1352a.firebaseapp.com",

    projectId:
        "ordnersystem-1352a",

    storageBucket:
        "ordnersystem-1352a.firebasestorage.app",

    messagingSenderId:
        "39473536985",

    appId:
        "1:39473536985:web:7dae48028c28dabc6a03c8"

};


/* =========================
   FIREBASE APP
========================= */

const firebaseApp =
    initializeApp(firebaseConfig);

const auth =
    getAuth(firebaseApp);

const db =
    getFirestore(firebaseApp);


/* =========================
   ADMIN IDS
========================= */

const ADMIN_UID_1 =
    "DQDq2eSl9HZbJJR6yiSgNm6YWaz1";

const ADMIN_UID_2 =
    "HIER-ZWEITE-ADMIN-UID-EINTRAGEN";


/* =========================
   VARIABLEN
========================= */

let currentUser = null;

let chips = [];

let editChipId = null;


/* =========================
   ADMIN
========================= */

function isAdmin() {

    if (!currentUser)
        return false;

    return (
        currentUser.uid === ADMIN_UID_1 ||
        currentUser.uid === ADMIN_UID_2
    );

}


/* =========================
   LOGIN
========================= */

document
    .getElementById("loginButton")
    .addEventListener(
        "click",
        login
    );


async function login() {

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;


    if (!email || !password) {

        document
            .getElementById("loginMessage")
            .innerText =
            "Bitte E-Mail und Passwort eingeben.";

        return;
    }


    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        // Passwort direkt wieder löschen
        document
            .getElementById("loginPassword")
            .value = "";

    }

    catch(error) {

        console.error(error);

        document
            .getElementById("loginMessage")
            .innerText =
            "E-Mail oder Passwort falsch.";

    }

}


/* =========================
   LOGOUT
========================= */

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        logout
    );


async function logout() {

    await signOut(auth);


    // ALLE Login-Felder löschen

    document
        .getElementById("loginEmail")
        .value = "";

    document
        .getElementById("loginPassword")
        .value = "";

    document
        .getElementById("loginMessage")
        .innerText = "";

}


/* =========================
   AUTH STATUS
========================= */

onAuthStateChanged(
    auth,
    user => {

        currentUser = user;


        if (!user) {

            document
                .getElementById("loginScreen")
                .style.display = "flex";

            document
                .getElementById("app")
                .style.display = "none";

            return;

        }


        document
            .getElementById("loginScreen")
            .style.display = "none";

        document
            .getElementById("app")
            .style.display = "block";


        document
            .getElementById("userEmail")
            .innerText =
            user.email;


        if (isAdmin()) {

            document
                .getElementById("adminPanel")
                .classList
                .remove("hidden");

            document
                .getElementById("usersSection")
                .classList
                .remove("hidden");

            loadUsers();

        }

        else {

            document
                .getElementById("adminPanel")
                .classList
                .add("hidden");

            document
                .getElementById("usersSection")
                .classList
                .add("hidden");

        }


        loadChips();

        loadLastScan();


        setTimeout(
            checkNFC,
            1200
        );

    }
);


/* =========================
   CHIPS LADEN
========================= */

function loadChips() {

    onSnapshot(
        collection(db, "chips"),
        snapshot => {

            chips = [];


            snapshot.forEach(
                chipDoc => {

                    chips.push({

                        firestoreId:
                            chipDoc.id,

                        ...chipDoc.data()

                    });

                }
            );


            showChips();

            updateStats();

        },
        error => {

            console.error(
                "Chip-Ladefehler:",
                error
            );

        }
    );

}


/* =========================
   CHIPS ANZEIGEN
========================= */

function showChips() {

    const list =
        document.getElementById(
            "chipList"
        );


    if (chips.length === 0) {

        list.innerHTML =
            "<p>Noch keine Chips vorhanden.</p>";

        return;

    }


    list.innerHTML = "";


    chips.forEach(
        chip => {

            const active =
                chip.scanActive === true;


            const div =
                document.createElement("div");


            div.className =
                "chip " +
                (
                    active
                    ? "chip-red"
                    : "chip-green"
                );


            let owner =
                chip.assignedEmail
                ? "Besitzer: " +
                  chip.assignedEmail
                : "Noch frei";


            let lastScan =
                chip.lastScannedEmail
                ? "Letzter Scan: " +
                  chip.lastScannedEmail
                : "Noch kein Scan";


            let buttons = "";


            /*
               NORMALER BENUTZER
            */

            if (!isAdmin()) {

                if (!chip.assignedTo) {

                    buttons += `
                        <button
                            class="green-button"
                            onclick="takeChip('${chip.firestoreId}')"
                        >
                            Chip übernehmen
                        </button>
                    `;

                }


                if (
                    chip.assignedTo ===
                    currentUser.uid
                ) {

                    buttons += `
                        <button
                            class="orange"
                            onclick="releaseChip('${chip.firestoreId}')"
                        >
                            Chip freigeben
                        </button>
                    `;

                }

            }


            /*
               ADMIN
            */

            if (isAdmin()) {

                buttons += `
                    <button
                        onclick="editChip('${chip.firestoreId}')"
                    >
                        Bearbeiten
                    </button>
                `;


                buttons += `
                    <button
                        class="red-button"
                        onclick="deleteChip('${chip.firestoreId}')"
                    >
                        Löschen
                    </button>
                `;

            }


            div.innerHTML = `

                <div class="chip-info">

                    <div class="chip-name">
                        ${escapeHTML(
                            chip.name || "Unbekannt"
                        )}
                    </div>

                    <div>
                        Chip-ID:
                        ${escapeHTML(
                            String(chip.chipId || "")
                        )}
                    </div>

                    <div>
                        ${
                            active
                            ? "🔴 ROT"
                            : "🟢 GRÜN"
                        }
                    </div>

                    <div class="chip-small">
                        ${escapeHTML(owner)}
                    </div>

                    <div class="chip-small">
                        ${escapeHTML(lastScan)}
                    </div>

                </div>

                <div class="chip-buttons">
                    ${buttons}
                </div>

            `;


            list.appendChild(div);

        }
    );

}


/* =========================
   HTML SICHER MACHEN
========================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================
   STATISTIK
========================= */

function updateStats() {

    let red = 0;


    chips.forEach(
        chip => {

            if (
                chip.scanActive === true
            ) {

                red++;

            }

        }
    );


    document
        .getElementById("totalCount")
        .innerText =
        chips.length;


    document
        .getElementById("redCount")
        .innerText =
        red;


    document
        .getElementById("greenCount")
        .innerText =
        chips.length - red;

}


/* =========================
   CHIP ÜBERNEHMEN
========================= */

window.takeChip =
async function(id) {

    if (!currentUser)
        return;


    const chip =
        chips.find(
            x => x.firestoreId === id
        );


    if (!chip)
        return;


    if (chip.assignedTo) {

        alert(
            "Dieser Chip ist bereits vergeben."
        );

        return;

    }


    await updateDoc(
        doc(
            db,
            "chips",
            id
        ),
        {

            assignedTo:
                currentUser.uid,

            assignedEmail:
                currentUser.email

        }
    );

};


/* =========================
   CHIP FREIGEBEN
========================= */

window.releaseChip =
async function(id) {

    if (!currentUser)
        return;


    const chip =
        chips.find(
            x => x.firestoreId === id
        );


    if (!chip)
        return;


    if (
        chip.assignedTo !==
        currentUser.uid
    ) {

        alert(
            "Du besitzt diesen Chip nicht."
        );

        return;

    }


    await updateDoc(
        doc(
            db,
            "chips",
            id
        ),
        {

            assignedTo: null,

            assignedEmail: ""

        }
    );

};


/* =========================
   CHIP HINZUFÜGEN
========================= */

document
    .getElementById("addChipButton")
    .addEventListener(
        "click",
        openChipModal
    );


function openChipModal() {

    if (!isAdmin())
        return;


    editChipId = null;


    document
        .getElementById("chipModalTitle")
        .innerText =
        "Chip hinzufügen";


    document
        .getElementById("chipName")
        .value = "";


    document
        .getElementById("chipId")
        .value = "";


    document
        .getElementById("chipModal")
        .style.display =
        "flex";

}


/* =========================
   CHIP SPEICHERN
========================= */

document
    .getElementById("saveChipButton")
    .addEventListener(
        "click",
        saveChip
    );


async function saveChip() {

    if (!isAdmin())
        return;


    const name =
        document
            .getElementById("chipName")
            .value
            .trim();


    const chipId =
        document
            .getElementById("chipId")
            .value
            .trim();


    if (!name || !chipId) {

        alert(
            "Bitte Name und Chip-ID eingeben."
        );

        return;

    }


    /*
       Prüfen, ob Chip-ID
       bereits existiert.
    */

    const exists =
        chips.some(
            chip =>
                String(chip.chipId) ===
                String(chipId)
                &&
                chip.firestoreId !==
                editChipId
        );


    if (exists) {

        alert(
            "Diese Chip-ID gibt es bereits."
        );

        return;

    }


    if (editChipId) {

        await updateDoc(
            doc(
                db,
                "chips",
                editChipId
            ),
            {

                name: name,

                chipId: chipId

            }
        );

    }

    else {

        await addDoc(
            collection(db, "chips"),
            {

                name: name,

                chipId: chipId,

                assignedTo: null,

                assignedEmail: "",

                scanActive: false,

                lastScannedBy: "",

                lastScannedEmail: "",

                lastScannedAt: null,

                createdAt:
                    serverTimestamp(),

                createdBy:
                    currentUser.uid

            }
        );

    }


    closeModal(
        "chipModal"
    );

}


/* =========================
   CHIP BEARBEITEN
========================= */

window.editChip =
function(id) {

    if (!isAdmin())
        return;


    const chip =
        chips.find(
            x => x.firestoreId === id
        );


    if (!chip)
        return;


    editChipId = id;


    document
        .getElementById("chipModalTitle")
        .innerText =
        "Chip bearbeiten";


    document
        .getElementById("chipName")
        .value =
        chip.name || "";


    document
        .getElementById("chipId")
        .value =
        chip.chipId || "";


    document
        .getElementById("chipModal")
        .style.display =
        "flex";

};


/* =========================
   CHIP LÖSCHEN
========================= */

window.deleteChip =
async function(id) {

    if (!isAdmin())
        return;


    const chip =
        chips.find(
            x => x.firestoreId === id
        );


    if (!chip)
        return;


    const yes =
        confirm(
            "Diesen Chip wirklich löschen?"
        );


    if (!yes)
        return;


    await deleteDoc(
        doc(
            db,
            "chips",
            id
        )
    );

};


/* =========================
   USER MODAL
========================= */

document
    .getElementById("addUserButton")
    .addEventListener(
        "click",
        openUserModal
    );


function openUserModal() {

    if (!isAdmin())
        return;


    document
        .getElementById("newUserName")
        .value = "";

    document
        .getElementById("newUserEmail")
        .value = "";

    document
        .getElementById("newUserPassword")
        .value = "";

    document
        .getElementById("userMessage")
        .innerText = "";


    document
        .getElementById("userModal")
        .style.display =
        "flex";

}


/* =========================
   USER ERSTELLEN
========================= */

document
    .getElementById("createUserButton")
    .addEventListener(
        "click",
        createUser
    );


async function createUser() {

    if (!isAdmin())
        return;


    const name =
        document
            .getElementById("newUserName")
            .value
            .trim();


    const email =
        document
            .getElementById("newUserEmail")
            .value
            .trim();


    const password =
        document
            .getElementById("newUserPassword")
            .value;


    if (!name || !email || !password) {

        document
            .getElementById("userMessage")
            .innerText =
            "Bitte alles ausfüllen.";

        return;

    }


    if (password.length < 6) {

        document
            .getElementById("userMessage")
            .innerText =
            "Das Passwort muss mindestens 6 Zeichen haben.";

        return;

    }


    /*
       WICHTIG:

       Eine normale Firebase-Webseite darf
       keinen Admin-Service-Key enthalten.

       Deshalb wird hier die sekundäre
       Firebase-App verwendet.

       Dadurch wird der aktuelle Admin
       nicht ausgeloggt.
    */

    try {

        const secondaryApp =
            initializeApp(
                firebaseConfig,
                "UserCreationApp"
            );


        const secondaryAuth =
            getAuth(
                secondaryApp
            );


        const result =
            await createUserWithEmailAndPassword(
                secondaryAuth,
                email,
                password
            );


        /*
           Benutzerprofil speichern
        */

        await setDoc(
            doc(
                db,
                "users",
                result.user.uid
            ),
            {

                name: name,

                email: email,

                role: "user",

                createdAt:
                    serverTimestamp(),

                createdBy:
                    currentUser.uid

            }
        );


        /*
           Sekundären Benutzer wieder ausloggen
        */

        await signOut(
            secondaryAuth
        );


        document
            .getElementById("userMessage")
            .innerText =
            "Benutzer erfolgreich erstellt.";


        document
            .getElementById("newUserPassword")
            .value = "";


    }

    catch(error) {

        console.error(error);

        let text =
            "Benutzer konnte nicht erstellt werden.";


        if (
            error.code ===
            "auth/email-already-in-use"
        ) {

            text =
                "Diese E-Mail gibt es bereits.";

        }


        if (
            error.code ===
            "auth/invalid-email"
        ) {

            text =
                "Die E-Mail-Adresse ist ungültig.";

        }


        document
            .getElementById("userMessage")
            .innerText =
            text;

    }

}


/* =========================
   BENUTZER LADEN
========================= */

function loadUsers() {

    onSnapshot(
        collection(db, "users"),
        snapshot => {

            const list =
                document
                    .getElementById(
                        "usersList"
                    );


            list.innerHTML = "";


            if (snapshot.empty) {

                list.innerHTML =
                    "<p>Keine Benutzer vorhanden.</p>";

                return;

            }


            snapshot.forEach(
                userDoc => {

                    const user =
                        userDoc.data();


                    const div =
                        document
                            .createElement(
                                "div"
                            );


                    div.className =
                        "user-row";


                    div.innerHTML = `

                        <strong>
                            ${escapeHTML(
                                user.name ||
                                "Unbekannt"
                            )}
                        </strong>

                        <br>

                        ${escapeHTML(
                            user.email || ""
                        )}

                        <br>

                        <small>
                            Rolle:
                            ${escapeHTML(
                                user.role ||
                                "user"
                            )}
                        </small>

                    `;


                    list.appendChild(div);

                }
            );

        }
    );

}


/* =========================
   LETZTEN SCAN LADEN
========================= */

function loadLastScan() {

    onSnapshot(
        doc(
            db,
            "system",
            "currentScan"
        ),
        snapshot => {

            const box =
                document
                    .getElementById(
                        "lastScan"
                    );


            if (!snapshot.exists()) {

                box.innerText =
                    "Noch kein Scan.";

                return;

            }


            const scan =
                snapshot.data();


            box.innerHTML = `

                <strong>
                    Chip:
                    ${escapeHTML(
                        String(
                            scan.chipId || ""
                        )
                    )}
                </strong>

                <br>

                Gescannt von:
                ${escapeHTML(
                    scan.scannedEmail || ""
                )}

                <br>

                Status:
                ${
                    scan.active
                    ? "🔴 ROT"
                    : "🟢 GRÜN"
                }

            `;

        }
    );

}


/* =========================
   NFC
========================= */

async function checkNFC() {

    if (!currentUser)
        return;


    const params =
        new URLSearchParams(
            window.location.search
        );


    const chipId =
        params.get("chip");


    if (!chipId)
        return;


    const chip =
        chips.find(
            x =>
                String(x.chipId) ===
                String(chipId)
        );


    if (!chip) {

        alert(
            "Unbekannter NFC-Chip: " +
            chipId
        );

        return;

    }


    /*
       1. Scan = ROT
       2. Scan = GRÜN
       3. Scan = ROT
       usw.
    */

    const newStatus =
        chip.scanActive !== true;


    await updateDoc(
        doc(
            db,
            "chips",
            chip.firestoreId
        ),
        {

            scanActive:
                newStatus,

            lastScannedBy:
                currentUser.uid,

            lastScannedEmail:
                currentUser.email,

            lastScannedAt:
                serverTimestamp()

        }
    );


    await setDoc(
        doc(
            db,
            "system",
            "currentScan"
        ),
        {

            chipId:
                chip.chipId,

            scannedBy:
                currentUser.uid,

            scannedEmail:
                currentUser.email,

            active:
                newStatus,

            scannedAt:
                serverTimestamp()

        }
    );


    /*
       Chip aus URL entfernen,
       damit ein Neuladen nicht
       automatisch erneut scannt.
    */

    window.history.replaceState(
        {},
        document.title,
        window.location.pathname
    );

}
