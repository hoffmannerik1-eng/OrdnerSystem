<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>OrdnerSystem</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#f4f7fb;
    --card:#ffffff;
    --text:#172033;
    --muted:#6c7890;
    --border:#e4e9f1;
    --primary:#2563eb;
    --primary2:#1d4ed8;
    --green:#16a34a;
    --green-bg:#dcfce7;
    --red:#dc2626;
    --red-bg:#fee2e2;
    --orange:#ea580c;
    --orange-bg:#ffedd5;
    --sidebar:#0b1220;
    --sidebar2:#111a2d;
    --shadow:0 10px 35px rgba(15,23,42,.08);
}

body.dark{
    --bg:#080d17;
    --card:#111827;
    --text:#f3f4f6;
    --muted:#9ca3af;
    --border:#263246;
    --sidebar:#050912;
    --sidebar2:#0c1423;
    --shadow:0 12px 35px rgba(0,0,0,.35);
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Inter,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at 20% 20%,rgba(37,99,235,.16),transparent 35%),
        radial-gradient(circle at 80% 80%,rgba(14,165,233,.12),transparent 35%),
        var(--bg);
}

.loginBox{
    width:min(460px,100%);
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:34px;
    box-shadow:var(--shadow);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:800;
    font-size:23px;
}

.logoIcon{
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    font-size:24px;
}

.loginTitle{
    margin-top:30px;
    font-size:29px;
    font-weight:800;
}

.loginSub{
    color:var(--muted);
    margin-top:8px;
    margin-bottom:25px;
}

.formGroup{
    margin-bottom:16px;
}

.formGroup label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.input{
    width:100%;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:12px;
    padding:13px 14px;
    outline:none;
    transition:.2s;
}

.input:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.btn{
    border:0;
    border-radius:11px;
    padding:11px 15px;
    font-weight:700;
    transition:.18s;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
}

.btn:hover{
    transform:translateY(-1px);
}

.btnPrimary{
    color:white;
    background:var(--primary);
}

.btnPrimary:hover{
    background:var(--primary2);
}

.btnSecondary{
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--border);
}

.btnDanger{
    background:var(--red-bg);
    color:var(--red);
}

.btnSuccess{
    background:var(--green-bg);
    color:var(--green);
}

.btnWarning{
    background:var(--orange-bg);
    color:var(--orange);
}

.full{
    width:100%;
}

.loginSwitch{
    margin-top:18px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
}

.linkBtn{
    border:0;
    background:none;
    color:var(--primary);
    font-weight:700;
}

#app{
    min-height:100vh;
    display:flex;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:250px;
    background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));
    color:white;
    padding:20px 14px;
    z-index:100;
    overflow-y:auto;
}

.sideLogo{
    display:flex;
    align-items:center;
    gap:11px;
    padding:8px 10px 24px;
    font-size:20px;
    font-weight:800;
}

.sideLogoIcon{
    width:38px;
    height:38px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
}

.navTitle{
    font-size:11px;
    color:#7f8ba3;
    text-transform:uppercase;
    letter-spacing:1px;
    padding:16px 11px 7px;
}

.navBtn{
    width:100%;
    border:0;
    background:transparent;
    color:#b9c3d4;
    display:flex;
    align-items:center;
    gap:11px;
    padding:12px 12px;
    border-radius:10px;
    margin:2px 0;
    text-align:left;
    font-weight:600;
}

.navBtn:hover{
    background:rgba(255,255,255,.07);
    color:white;
}

.navBtn.active{
    background:rgba(37,99,235,.9);
    color:white;
}

.sideBottom{
    margin-top:30px;
    padding-top:15px;
    border-top:1px solid rgba(255,255,255,.08);
}

.main{
    width:calc(100% - 250px);
    margin-left:250px;
    min-height:100vh;
}

.topbar{
    height:72px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:50;
}

.mobileMenu{
    display:none;
}

.topSearch{
    width:min(420px,45vw);
    position:relative;
}

.topSearch input{
    width:100%;
    border:1px solid var(--border);
    border-radius:12px;
    padding:11px 14px 11px 39px;
    background:var(--bg);
    color:var(--text);
    outline:none;
}

.topSearch span{
    position:absolute;
    left:13px;
    top:10px;
}

.topRight{
    display:flex;
    align-items:center;
    gap:10px;
}

.iconBtn{
    width:40px;
    height:40px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.userMini{
    display:flex;
    align-items:center;
    gap:9px;
    padding-left:8px;
}

.avatar{
    width:36px;
    height:36px;
    border-radius:50%;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.content{
    padding:28px;
    max-width:1700px;
    margin:auto;
}

.pageHeader{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:15px;
    margin-bottom:25px;
}

.pageTitle{
    font-size:29px;
    font-weight:850;
}

.pageSub{
    color:var(--muted);
    margin-top:5px;
}

.headerActions{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:22px;
}

.stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:17px;
    padding:19px;
    box-shadow:var(--shadow);
}

.statTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.statIcon{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(37,99,235,.1);
    font-size:20px;
}

.statValue{
    font-size:29px;
    font-weight:850;
    margin-top:14px;
}

.statLabel{
    color:var(--muted);
    font-size:13px;
    margin-top:3px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:var(--shadow);
}

.cardHeader{
    padding:18px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.cardTitle{
    font-weight:800;
}

.cardBody{
    padding:20px;
}

.folderGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.folderCard{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:17px;
    padding:18px;
    transition:.2s;
    position:relative;
    overflow:hidden;
}

.folderCard:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow);
}

.folderStatus{
    position:absolute;
    top:15px;
    right:15px;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#94a3b8;
    box-shadow:0 0 0 5px rgba(148,163,184,.12);
}

.folderStatus.green{
    background:#16a34a;
    box-shadow:0 0 0 5px rgba(22,163,74,.14);
}

.folderStatus.red{
    background:#dc2626;
    box-shadow:0 0 0 5px rgba(220,38,38,.14);
}

.folderIcon{
    width:50px;
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:#eff6ff;
    font-size:25px;
    margin-bottom:13px;
}

body.dark .folderIcon{
    background:#172554;
}

.folderName{
    font-size:18px;
    font-weight:800;
    padding-right:25px;
}

.folderCategory{
    display:inline-block;
    margin-top:8px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:20px;
    padding:4px 9px;
    font-size:11px;
    color:var(--muted);
}

.folderDescription{
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
    margin-top:11px;
    min-height:40px;
}

.folderMeta{
    margin-top:14px;
    padding-top:13px;
    border-top:1px solid var(--border);
    font-size:12px;
    color:var(--muted);
}

.holder{
    margin-top:8px;
    color:var(--text);
    font-weight:700;
}

.folderActions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:14px;
}

.smallBtn{
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    border-radius:9px;
    padding:8px 9px;
    font-size:12px;
    font-weight:700;
}

.smallBtn:hover{
    border-color:var(--primary);
    color:var(--primary);
}

.statusPanel{
    margin-top:13px;
    padding:11px;
    border-radius:11px;
    font-size:12px;
    background:var(--bg);
    border:1px solid var(--border);
}

.statusPanel.green{
    background:var(--green-bg);
    color:var(--green);
    border-color:#bbf7d0;
}

.statusPanel.red{
    background:var(--red-bg);
    color:var(--red);
    border-color:#fecaca;
}

.empty{
    padding:50px 20px;
    text-align:center;
    color:var(--muted);
}

.emptyIcon{
    font-size:45px;
    margin-bottom:12px;
}

.tableWrap{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:14px 12px;
    text-align:left;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
}

th{
    color:var(--muted);
    font-size:12px;
    text-transform:uppercase;
}

td{
    font-size:14px;
}

.badge{
    display:inline-flex;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:800;
}

.badgeGreen{
    background:var(--green-bg);
    color:var(--green);
}

.badgeRed{
    background:var(--red-bg);
    color:var(--red);
}

.badgeBlue{
    background:#dbeafe;
    color:#1d4ed8;
}

.badgeOrange{
    background:var(--orange-bg);
    color:var(--orange);
}

.modalOverlay{
    position:fixed;
    inset:0;
    background:rgba(2,6,23,.55);
    backdrop-filter:blur(5px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:500;
}

.modal{
    width:min(600px,100%);
    max-height:90vh;
    overflow:auto;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:0 25px 80px rgba(0,0,0,.25);
}

.modalHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:19px 20px;
    border-bottom:1px solid var(--border);
}

.modalTitle{
    font-weight:850;
    font-size:18px;
}

.modalBody{
    padding:20px;
}

.modalFooter{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    padding:16px 20px;
    border-top:1px solid var(--border);
}

.closeBtn{
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:23px;
}

.toastBox{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:1000;
    display:flex;
    flex-direction:column;
    gap:9px;
}

.toast{
    min-width:280px;
    max-width:420px;
    background:#111827;
    color:white;
    padding:13px 15px;
    border-radius:12px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    animation:toastIn .2s ease;
    font-size:13px;
}

.toast.success{
    border-left:4px solid #22c55e;
}

.toast.error{
    border-left:4px solid #ef4444;
}

.toast.warning{
    border-left:4px solid #f59e0b;
}

@keyframes toastIn{
    from{
        transform:translateY(10px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

.scanHero{
    padding:22px;
    border-radius:17px;
    background:
        radial-gradient(circle at 80% 20%,rgba(37,99,235,.25),transparent 35%),
        linear-gradient(135deg,#0b1220,#18253b);
    color:white;
    margin-bottom:20px;
}

.scanHero h2{
    font-size:24px;
    margin-bottom:6px;
}

.scanHero p{
    color:#aab5c7;
}

.linkBox{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.linkBox input{
    flex:1;
}

.profileGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.userCard{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px;
    border:1px solid var(--border);
    border-radius:13px;
    margin-bottom:10px;
}

.userInfo{
    flex:1;
}

.userName{
    font-weight:800;
}

.userEmail{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
}

@media(max-width:1100px){
    .folderGrid{
        grid-template-columns:repeat(2,1fr);
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:800px){
    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        width:100%;
        margin-left:0;
    }

    .mobileMenu{
        display:flex;
    }

    .topbar{
        padding:0 15px;
    }

    .topSearch{
        display:none;
    }

    .content{
        padding:17px;
    }

    .pageHeader{
        flex-direction:column;
    }

    .folderGrid{
        grid-template-columns:1fr;
    }

    .profileGrid{
        grid-template-columns:1fr;
    }

    .userMini .userText{
        display:none;
    }
}

@media(max-width:500px){
    .stats{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .stat{
        padding:14px;
    }

    .statValue{
        font-size:24px;
    }

    .loginBox{
        padding:24px;
    }

    .headerActions{
        width:100%;
    }

    .headerActions .btn{
        flex:1;
    }

    .linkBox{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div id="loginScreen">

    <div class="loginBox">

        <div class="logo">
            <div class="logoIcon">📁</div>
            <span>OrdnerSystem</span>
        </div>

        <div class="loginTitle" id="loginTitle">
            Willkommen zurück
        </div>

        <div class="loginSub" id="loginSub">
            Melde dich an, um deine Ordner zu verwalten.
        </div>

        <form id="loginForm">

            <div class="formGroup">
                <label>E-Mail</label>
                <input
                    id="loginEmail"
                    class="input"
                    type="email"
                    autocomplete="email"
                    required
                    placeholder="name@example.com">
            </div>

            <div class="formGroup">
                <label>Passwort</label>
                <input
                    id="loginPassword"
                    class="input"
                    type="password"
                    autocomplete="current-password"
                    required
                    placeholder="••••••••">
            </div>

            <button class="btn btnPrimary full" type="submit">
                🔐 Anmelden
            </button>

        </form>

        <form id="registerForm" class="hidden">

            <div class="formGroup">
                <label>Name</label>
                <input
                    id="registerName"
                    class="input"
                    type="text"
                    required
                    placeholder="Max Mustermann">
            </div>

            <div class="formGroup">
                <label>E-Mail</label>
                <input
                    id="registerEmail"
                    class="input"
                    type="email"
                    required
                    placeholder="name@example.com">
            </div>

            <div class="formGroup">
                <label>Passwort</label>
                <input
                    id="registerPassword"
                    class="input"
                    type="password"
                    minlength="6"
                    required
                    placeholder="Mindestens 6 Zeichen">
            </div>

            <button class="btn btnPrimary full" type="submit">
                👤 Konto erstellen
            </button>

        </form>

        <div class="loginSwitch">
            <span id="switchText">Noch kein Konto?</span>
            <button class="linkBtn" id="switchAuth">
                Registrieren
            </button>
        </div>

    </div>

</div>


<div id="app" class="hidden">

    <aside class="sidebar" id="sidebar">

        <div class="sideLogo">
            <div class="sideLogoIcon">📁</div>
            OrdnerSystem
        </div>

        <div class="navTitle">Übersicht</div>

        <button class="navBtn active" data-page="dashboard">
            📊
            <span>Dashboard</span>
        </button>

        <button class="navBtn" data-page="folders">
            📁
            <span>Ordner</span>
        </button>

        <button class="navBtn" data-page="categories">
            🗂️
            <span>Kategorien</span>
        </button>

        <button class="navBtn" data-page="requests">
            📋
            <span>Anfragen</span>
        </button>

        <div class="navTitle">Verwaltung</div>

        <button class="navBtn" data-page="users">
            👥
            <span>Benutzer</span>
        </button>

        <button class="navBtn" data-page="notifications">
            🔔
            <span>Benachrichtigungen</span>
        </button>

        <button class="navBtn" data-page="settings">
            ⚙️
            <span>Einstellungen</span>
        </button>

        <div class="sideBottom">

            <button class="navBtn" id="helpBtn">
                ❓
                <span>Hilfe</span>
            </button>

            <button class="navBtn" id="logoutBtn">
                🚪
                <span>Abmelden</span>
            </button>

        </div>

    </aside>


    <main class="main">

        <header class="topbar">

            <button class="iconBtn mobileMenu" id="mobileMenu">
                ☰
            </button>

            <div class="topSearch">
                <span>🔍</span>
                <input
                    id="globalSearch"
                    placeholder="Suche...">
            </div>

            <div class="topRight">

                <button class="iconBtn" id="themeBtn">
                    🌙
                </button>

                <button class="iconBtn" id="notificationBtn">
                    🔔
                </button>

                <div class="userMini">

                    <div class="avatar" id="topAvatar">
                        U
                    </div>

                    <div class="userText">
                        <strong id="topName">Benutzer</strong>
                        <div style="font-size:11px;color:var(--muted)" id="topRole">
                            Benutzer
                        </div>
                    </div>

                </div>

            </div>

        </header>


        <div class="content" id="pageContent"></div>

    </main>

</div>


<div id="modalOverlay" class="modalOverlay hidden">

    <div class="modal">

        <div class="modalHeader">

            <div class="modalTitle" id="modalTitle">
                Fenster
            </div>

            <button class="closeBtn" id="modalClose">
                ×
            </button>

        </div>

        <form id="modalForm">

            <div class="modalBody" id="modalBody"></div>

            <div class="modalFooter">

                <button
                    type="button"
                    class="btn btnSecondary"
                    id="modalCancel">
                    Abbrechen
                </button>

                <button
                    type="submit"
                    class="btn btnPrimary"
                    id="modalSave">
                    Speichern
                </button>

            </div>

        </form>

    </div>

</div>


<div class="toastBox" id="toastBox"></div>


<script type="module">

import {

const $ = id => document.getElementById(id);

function esc(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function initials(name,email){

    const text = name || email || "U";

    return text
        .split(/\s+/)
        .slice(0,2)
        .map(x => x[0])
        .join("")
        .toUpperCase();

}


function friendlyError(error){

    const code = error?.code || "";

    const map = {

        "auth/invalid-credential":
            "E-Mail oder Passwort ist falsch.",

        "auth/email-already-in-use":
            "Diese E-Mail wird bereits verwendet.",

        "auth/weak-password":
            "Das Passwort ist zu schwach.",

        "auth/invalid-email":
            "Die E-Mail-Adresse ist ungültig.",

        "auth/network-request-failed":
            "Netzwerkfehler.",

        "permission-denied":
            "Firebase hat den Zugriff verweigert.",

        "failed-precondition":
            "Firebase benötigt noch eine Einstellung.",

        "unavailable":
            "Firebase ist momentan nicht erreichbar."

    };

    return map[code] ||
        error?.message ||
        "Unbekannter Fehler.";

}


function toast(message,type="success"){

    const box = $("toastBox");

    const el = document.createElement("div");

    el.className = "toast " + type;

    el.textContent = message;

    box.appendChild(el);

    setTimeout(() => {

        el.remove();

    },4500);

}


function formatDate(timestamp){

    if(!timestamp) return "—";

    try{

        const d = timestamp.toDate
            ? timestamp.toDate()
            : new Date(timestamp);

        return d.toLocaleString("de-DE",{
            dateStyle:"short",
            timeStyle:"short"
        });

    }catch{

        return "—";

    }

}


/* =========================================================
   CHIP ID
========================================================= */

function makeChipId(){

    const random =
        Math.random()
        .toString(36)
        .substring(2,8)
        .toUpperCase();

    const time =
        Date.now()
        .toString(36)
        .toUpperCase();

    return "CHIP-" + random + "-" + time;

}

function getChipLink(folder){

    /*
       NICHTS mit deinem GitHub-Namen hier eintragen.

       Die aktuell geöffnete Website wird automatisch benutzt.

       Beispiel:
       https://DEIN-ECHTER-NAME.github.io/OrdnerSystem/

       Dadurch funktioniert auch ein Benutzername mit "1".
    */

    const url = new URL(window.location.href);

    url.search = "";
    url.hash = "";

    url.searchParams.set(
        "folder",
        folder.chipId || folder.id
    );

    return url.toString();

}

async function copyText(text){

    try{

        await navigator.clipboard.writeText(text);

        toast("🔗 Link kopiert.","success");

    }catch{

        const textarea = document.createElement("textarea");

        textarea.value = text;

        textarea.style.position = "fixed";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

        toast("🔗 Link kopiert.","success");

    }

}

        if(snap.exists()){

            currentProfile = snap.data();

        }else{

            currentProfile = {

                name:
                    currentUser.displayName ||
                    currentUser.email ||
                    "Benutzer",

                email:

                role:

            await setDoc(
                ref,

    unsubscribeFolders = null;
    unsubscribeCategories = null;
    unsubscribeRequests = null;
    unsubscribeUsers = null;

}

function openNewFolder(){

        )
        .join("");

    openModal(

            <label>Ordnername</label>
            <input
                id="folderName"
                class="input"
                required
                placeholder="z. B. Kundenakten">
        </div>

            <label>Kategorie</label>

                class="input"
                rows="4"

            ein eindeutiger Chip-Link erzeugt.

        async () => {

            const name =
                $("folderName").value.trim();

            if(!name){

            const chipId =
                makeChipId();

            await addDoc(
                collection(db,"folders"),

                    name,
                    category,
                    description,

                    chipId,

                    chipActive:false,

                    heldByUid:"",

                    createdBy:
                        currentUser.uid,

                    createdByName:
                        currentProfile?.name ||
                        currentUser.displayName ||
                        currentUser.email,

                    createdByEmail:
                        currentUser.email || "",

                    createdAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                }
            );

            closeModal();

            toast(
                "📁 Ordner erfolgreich erstellt.",
                "success"

        }

/* =========================================================
   REAL CHIP/NFC SCAN
========================================================= */

async function scanChip(folder){

    if(!currentUser){

        toast(
            "❌ Bitte zuerst anmelden.",
            "error"
        );

        return;

    }

    const ref =
        doc(db,"folders",folder.id);

    try{

        let newState = false;

        await runTransaction(
            db,
            async transaction => {

                const snapshot =
                    await transaction.get(ref);

                if(!snapshot.exists()){

                    throw new Error(
                        "Ordner existiert nicht."
                    );

                }

                const data =
                    snapshot.data();

                const oldState =
                    data.chipActive === true;

                newState = !oldState;

                transaction.update(
                    ref,
                    {

                        chipActive:
                            newState,

                        lastScannedByUid:
                            currentUser.uid,

                        lastScannedByName:
                            currentProfile?.name ||
                            currentUser.displayName ||
                            currentUser.email,

                        lastScannedAt:
                            serverTimestamp(),

                        updatedAt:
                            serverTimestamp()

                    }
                );

            }
        );

        if(newState){

            toast(
                "🟢 Chip erkannt – Ordner ist jetzt aktiv.",
                "success"
            );

        }else{

            toast(
                "🔴 Chip erneut erkannt – Ordner ist jetzt deaktiviert.",
                "warning"
            );

        }

        currentPage = "folders";

        renderPage();

    }catch(error){

        console.error(error);

        toast(
            "❌ Chip konnte nicht verarbeitet werden: " +
            friendlyError(error),
            "error"
        );

    }

}


/* =========================================================
   INCOMING NFC / CHIP LINK
========================================================= */

let incomingHandled = false;

async function handleIncomingChipLink(){

    if(incomingHandled) return;

    incomingHandled = true;

    const params =
        new URLSearchParams(
            window.location.search
        );

    const chip =
        params.get("folder");

    if(!chip) return;

    const folder =
        folders.find(
            x =>
                x.chipId === chip ||
                x.id === chip
        );

    if(!folder){

        toast(
            "❌ Kein Ordner für diesen Chip gefunden.",
            "error"
        );

        return;

    }

    /*
       Genau hier passiert der Scan.

       Der NFC-Chip öffnet die URL:
       ?folder=CHIP-....

       Danach wird der Status atomar
       zwischen rot und grün umgeschaltet.
    */

    await scanChip(folder);

}

document.addEventListener(
    "click",
    async e => {

        const button =
            e.target.closest("[data-action]");

        if(button){

            const action =
                button.dataset.action;

            const id =
                button.dataset.id;

            try{

                if(action === "new-folder")
                    openNewFolder();

                else if(action === "open-folder")
                    openFolder(id);

                else if(action === "copy-link"){

                    const folder =
                        folders.find(x => x.id === id);

                    if(folder)
                        copyText(
                            getChipLink(folder)
                        );

                }

                else if(action === "edit-folder")
                    openEditFolder(id);

                else if(action === "delete-folder")
                    await deleteFolder(id);

                else if(action === "take-folder")
                    await takeFolder(id);

                else if(action === "release-folder")
                    await releaseFolder(id);

                else if(action === "new-category")
                    openNewCategory();

                else if(action === "delete-category")
                    await deleteCategory(id);

                else if(action === "new-request")
                    openNewRequest();

                else if(action === "toggle-request")
                    await toggleRequest(id);

                else if(action === "toggle-theme")
                    toggleTheme();

                else if(action === "save-profile")
                    await saveProfile();

                else if(action === "scan-link")
                    showScanLink();

            }catch(error){

                console.error(error);

                toast(
                    "❌ " + friendlyError(error),
                    "error"
                );

            }

        }


        const direct =
            e.target.closest("[data-page-direct]");

        if(direct){

            currentPage =
                direct.dataset.pageDirect;

            document
                .querySelectorAll(".navBtn[data-page]")
                .forEach(x =>
                    x.classList.remove("active")
                );

            document
                .querySelector(
                    `.navBtn[data-page="${currentPage}"]`
                )
                ?.classList.add("active");

            renderPage();

        }

    }
);

function showScanLink(){

    const existing =
        folders[0];

    if(!existing){

        toast(
            "📁 Erstelle zuerst einen Ordner.",
            "warning"
        );

        return;

    }

    const link =
        getChipLink(existing);

    openModal(
        "📡 Chip-Link",
        `

        <div class="formGroup">

            <label>Ordner auswählen</label>

            <select
                id="scanFolderSelect"
                class="input">

                ${
                    folders.map(
                        f =>
                        `<option value="${esc(f.id)}">
                            ${esc(f.name)}
                        </option>`
                    ).join("")
                }

            </select>

        </div>

        <div class="formGroup">

            <label>Link</label>

            <input
                id="scanLinkInput"
                class="input"
                readonly
                value="${esc(link)}">

        </div>

        <div class="statusPanel">

            🔗 Der Link wird automatisch
            aus der aktuellen Website-Adresse
            erzeugt.

            <br><br>

            Dadurch musst du deinen
            GitHub-Benutzernamen hier
            <strong>nicht</strong> eintragen.

        </div>

        `,
        "Kopieren",
        async () => {

            const id =
                $("scanFolderSelect").value;

            const folder =
                folders.find(
                    x => x.id === id
                );

            if(folder){

                await copyText(
                    getChipLink(folder)
                );

                closeModal();

            }

        }
    );

    setTimeout(() => {

        $("scanFolderSelect")
        ?.addEventListener(
            "change",
            e => {

                const folder =
                    folders.find(
                        x =>
                        x.id === e.target.value
                    );

                if(folder){

                    $("scanLinkInput")
                    .value =
                        getChipLink(folder);

                }

            }
        );

    },50);

}


/* =========================================================
   AUTO CHIP ID REPAIR
========================================================= */

async function repairMissingChipIds(){

    for(const folder of folders){

        if(
            !folder.chipId &&
            folder.id
        ){

            try{

                await updateDoc(
                    doc(db,"folders",folder.id),
                    {

                        chipId:
                            makeChipId(),

                        updatedAt:
                            serverTimestamp()

                    }
                );

            }catch(error){

                console.error(
                    "Chip-ID konnte nicht erstellt werden:",
                    error
                );

            }

        }

    }

}


/* =========================================================
   WATCH FOLDER DATA FOR MISSING CHIP IDS
========================================================= */

let repairTimer = null;

function scheduleChipRepair(){

    clearTimeout(repairTimer);

    repairTimer =
        setTimeout(
            repairMissingChipIds,
            1000
        );

}


/* =========================================================
   RE-RENDER HOOK
========================================================= */

const originalRenderPage =
    renderPage;


/* =========================================================
   PERIODIC CHIP CHECK
========================================================= */

setInterval(
    () => {

        if(
            currentUser &&
            folders.length
        ){

            scheduleChipRepair();

        }

    },
    5000
);

   INITIAL
========================================================= */

console.log(

);

console.log(
