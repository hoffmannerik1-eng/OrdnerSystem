<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>OrdnerSystem</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#f4f7fb;
    --surface:#ffffff;
    --surface2:#f8fafc;
    --border:#e2e8f0;
    --text:#0f172a;
    --muted:#64748b;
    --primary:#2563eb;
    --primary2:#1d4ed8;
    --green:#16a34a;
    --green-bg:#ecfdf3;
    --red:#dc2626;
    --red-bg:#fef2f2;
    --orange:#ea580c;
    --shadow:0 10px 35px rgba(15,23,42,.08);
    --radius:18px;
}

body.dark{
    --bg:#070b13;
    --surface:#0d1422;
    --surface2:#111b2c;
    --border:#1e293b;
    --text:#f8fafc;
    --muted:#94a3b8;
    --shadow:0 12px 40px rgba(0,0,0,.35);
}

html,body{
    width:100%;
    min-height:100%;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    background:var(--bg);
    color:var(--text);
}

body{
    overflow-x:hidden;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   LOGIN
========================= */

#authScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
        radial-gradient(circle at 20% 20%,rgba(37,99,235,.14),transparent 35%),
        radial-gradient(circle at 80% 80%,rgba(14,165,233,.10),transparent 35%),
        var(--bg);
}

.auth-box{
    width:100%;
    max-width:460px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:26px;
    box-shadow:var(--shadow);
    padding:34px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:22px;
    font-weight:800;
}

.logo-icon{
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:linear-gradient(135deg,#2563eb,#0ea5e9);
    color:#fff;
    font-size:23px;
}

.auth-title{
    margin-top:30px;
    font-size:29px;
    font-weight:800;
}

.auth-subtitle{
    margin-top:8px;
    color:var(--muted);
    line-height:1.5;
}

.auth-form{
    margin-top:25px;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
    font-weight:700;
    color:var(--muted);
}

.field input,
.field textarea,
.field select{
    width:100%;
    border:1px solid var(--border);
    background:var(--surface2);
    color:var(--text);
    border-radius:12px;
    padding:13px 14px;
    outline:none;
    transition:.2s;
}

.field textarea{
    min-height:100px;
    resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.primary-btn,
.secondary-btn,
.danger-btn,
.green-btn{
    border:0;
    border-radius:12px;
    padding:12px 16px;
    font-weight:750;
    transition:.2s;
}

.primary-btn{
    background:var(--primary);
    color:white;
}

.primary-btn:hover{
    background:var(--primary2);
    transform:translateY(-1px);
}

.secondary-btn{
    background:var(--surface2);
    color:var(--text);
    border:1px solid var(--border);
}

.danger-btn{
    background:var(--red);
    color:#fff;
}

.green-btn{
    background:var(--green);
    color:#fff;
}

.full{
    width:100%;
}

.auth-switch{
    margin-top:18px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
}

.auth-switch button{
    background:none;
    border:0;
    color:var(--primary);
    font-weight:700;
}

/* =========================
   APP
========================= */

#appScreen{
    min-height:100vh;
}

.app-layout{
    min-height:100vh;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:255px;
    flex-shrink:0;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    z-index:50;
}

.sidebar-top{
    padding:22px 18px;
    border-bottom:1px solid var(--border);
}

.sidebar-logo{
    display:flex;
    align-items:center;
    gap:11px;
    font-weight:800;
}

.sidebar-logo-icon{
    width:40px;
    height:40px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#2563eb,#0ea5e9);
    color:#fff;
}

.nav{
    padding:16px 12px;
    overflow:auto;
    flex:1;
}

.nav-section{
    margin:14px 9px 8px;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--muted);
    font-weight:800;
}

.nav-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:11px;
    border:0;
    background:transparent;
    color:var(--muted);
    padding:12px 12px;
    border-radius:12px;
    margin-bottom:3px;
    text-align:left;
    font-weight:650;
    transition:.2s;
}

.nav-item:hover{
    background:var(--surface2);
    color:var(--text);
}

.nav-item.active{
    background:rgba(37,99,235,.10);
    color:var(--primary);
}

.nav-icon{
    width:22px;
    text-align:center;
    font-size:17px;
}

.sidebar-bottom{
    padding:15px;
    border-top:1px solid var(--border);
}

.user-mini{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.user-mini-info{
    min-width:0;
    flex:1;
}

.user-mini-name{
    font-size:13px;
    font-weight:750;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-mini-email{
    font-size:11px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* MAIN */

.main{
    margin-left:255px;
    min-width:0;
    flex:1;
}

.topbar{
    height:72px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:40;
}

.mobile-menu{
    display:none;
}

.search{
    flex:1;
    max-width:550px;
    position:relative;
}

.search input{
    width:100%;
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:11px 14px 11px 40px;
    color:var(--text);
    outline:none;
}

.search span{
    position:absolute;
    left:14px;
    top:10px;
    color:var(--muted);
}

.top-actions{
    margin-left:auto;
    display:flex;
    gap:8px;
}

.icon-btn{
    width:40px;
    height:40px;
    border-radius:11px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
}

.icon-btn:hover{
    background:var(--surface2);
}

.page{
    padding:30px;
    max-width:1500px;
    margin:auto;
}

.page-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
    margin-bottom:25px;
}

.page-title{
    font-size:29px;
    font-weight:850;
    letter-spacing:-.03em;
}

.page-subtitle{
    color:var(--muted);
    margin-top:6px;
}

.header-actions{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
}

/* CARDS */

.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:17px;
    padding:19px;
    box-shadow:0 5px 20px rgba(15,23,42,.03);
}

.stat-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.stat-icon{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    background:var(--surface2);
    font-size:19px;
}

.stat-number{
    margin-top:17px;
    font-size:29px;
    font-weight:850;
}

.stat-label{
    color:var(--muted);
    margin-top:4px;
    font-size:13px;
}

.content-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:0 5px 25px rgba(15,23,42,.03);
}

.card-header{
    padding:19px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.card-title{
    font-weight:800;
}

.card-body{
    padding:20px;
}

/* FOLDERS */

.folder-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:16px;
}

.folder-card{
    position:relative;
    background:var(--surface);
    border:2px solid var(--border);
    border-radius:18px;
    padding:19px;
    transition:
        border-color .25s,
        box-shadow .25s,
        transform .2s,
        background .25s;
    overflow:hidden;
}

.folder-card:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow);
}

/* GRÜN */

.folder-card.folder-green{
    border-color:#22c55e;
    background:
        linear-gradient(
            135deg,
            rgba(34,197,94,.16),
            rgba(34,197,94,.035)
        ),
        var(--surface);
    box-shadow:
        0 0 0 1px rgba(34,197,94,.08),
        0 8px 30px rgba(34,197,94,.13);
}

/* ROT */

.folder-card.folder-red{
    border-color:#ef4444;
    background:
        linear-gradient(
            135deg,
            rgba(239,68,68,.14),
            rgba(239,68,68,.035)
        ),
        var(--surface);
    box-shadow:
        0 0 0 1px rgba(239,68,68,.07),
        0 8px 30px rgba(239,68,68,.12);
}

.folder-status{
    position:absolute;
    top:14px;
    right:14px;
    font-size:11px;
    font-weight:850;
    padding:5px 8px;
    border-radius:999px;
}

.folder-status.green{
    background:#dcfce7;
    color:#15803d;
}

.folder-status.red{
    background:#fee2e2;
    color:#b91c1c;
}

.folder-icon{
    width:52px;
    height:52px;
    border-radius:14px;
    background:var(--surface2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    margin-bottom:15px;
}

.folder-name{
    font-size:18px;
    font-weight:800;
    padding-right:60px;
}

.folder-description{
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
    margin-top:7px;
    min-height:39px;
}

.folder-meta{
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
    margin-top:15px;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    border:1px solid var(--border);
    background:var(--surface2);
    border-radius:999px;
    padding:5px 9px;
    font-size:11px;
    font-weight:700;
    color:var(--muted);
}

.folder-actions{
    display:flex;
    gap:7px;
    margin-top:17px;
    padding-top:14px;
    border-top:1px solid var(--border);
}

.small-btn{
    flex:1;
    border:1px solid var(--border);
    background:var(--surface2);
    color:var(--text);
    border-radius:9px;
    padding:9px 8px;
    font-size:12px;
    font-weight:750;
}

.small-btn:hover{
    border-color:var(--primary);
    color:var(--primary);
}

.small-btn.danger:hover{
    border-color:var(--red);
    color:var(--red);
}

.chip-line{
    margin-top:10px;
    display:flex;
    align-items:center;
    gap:7px;
    font-size:11px;
    color:var(--muted);
}

.chip-code{
    font-family:monospace;
    color:var(--text);
    font-weight:700;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* TABLE */

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    text-align:left;
    padding:13px 15px;
    border-bottom:1px solid var(--border);
    font-size:13px;
}

th{
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.05em;
}

tr:last-child td{
    border-bottom:0;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
}

.empty-icon{
    font-size:45px;
    margin-bottom:12px;
}

.empty-title{
    color:var(--text);
    font-weight:800;
    font-size:18px;
}

.empty-text{
    margin-top:5px;
}

/* MODAL */

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(2,6,23,.62);
    backdrop-filter:blur(5px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal-overlay.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:550px;
    max-height:90vh;
    overflow:auto;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:21px;
    box-shadow:0 30px 80px rgba(0,0,0,.28);
}

.modal-header{
    padding:19px 21px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
}

.modal-title{
    font-size:18px;
    font-weight:850;
}

.modal-close{
    width:34px;
    height:34px;
    border:0;
    border-radius:9px;
    background:var(--surface2);
    color:var(--text);
}

.modal-body{
    padding:21px;
}

.modal-footer{
    display:flex;
    justify-content:flex-end;
    gap:9px;
    padding:16px 21px;
    border-top:1px solid var(--border);
}

/* TOAST */

#toastContainer{
    position:fixed;
    right:20px;
    bottom:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:200;
    width:min(390px,calc(100vw - 40px));
}

.toast{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:4px solid var(--primary);
    box-shadow:var(--shadow);
    border-radius:13px;
    padding:14px 15px;
    animation:toastIn .22s ease;
    font-size:13px;
}

.toast.success{
    border-left-color:var(--green);
}

.toast.error{
    border-left-color:var(--red);
}

.toast.warning{
    border-left-color:var(--orange);
}

@keyframes toastIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* SCAN */

.scan-box{
    text-align:center;
    padding:15px 0 5px;
}

.scan-icon{
    width:90px;
    height:90px;
    margin:0 auto 18px;
    border-radius:25px;
    background:rgba(37,99,235,.10);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
}

.scan-result{
    margin-top:18px;
    padding:15px;
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--surface2);
}

/* DETAIL */

.detail-status{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

.status-dot{
    width:13px;
    height:13px;
    border-radius:50%;
}

.status-dot.green{
    background:#22c55e;
    box-shadow:0 0 0 5px rgba(34,197,94,.12);
}

.status-dot.red{
    background:#ef4444;
    box-shadow:0 0 0 5px rgba(239,68,68,.12);
}

.detail-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:13px;
}

.detail-item{
    padding:15px;
    border:1px solid var(--border);
    border-radius:13px;
    background:var(--surface2);
}

.detail-label{
    font-size:11px;
    color:var(--muted);
    font-weight:700;
    margin-bottom:6px;
}

.detail-value{
    font-size:14px;
    font-weight:750;
    word-break:break-word;
}

/* MOBILE */

@media(max-width:1100px){
    .folder-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .stats-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:800px){
    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
    }

    .mobile-menu{
        display:flex;
    }

    .topbar{
        padding:0 14px;
    }

    .search{
        max-width:none;
    }

    .page{
        padding:20px 14px;
    }

    .page-header{
        flex-direction:column;
    }

    .folder-grid{
        grid-template-columns:1fr;
    }

    .stats-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:520px){
    .auth-box{
        padding:25px 20px;
    }

    .stats-grid{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .stat-card{
        padding:14px;
    }

    .stat-number{
        font-size:23px;
    }

    .top-actions .icon-btn:nth-child(2){
        display:none;
    }

    .detail-grid{
        grid-template-columns:1fr;
    }

    .folder-actions{
        flex-wrap:wrap;
    }

    .small-btn{
        min-width:calc(50% - 4px);
    }
}
</style>
</head>

<body>

<!-- =========================
     AUTH
========================= -->

<section id="authScreen">

    <div class="auth-box">

        <div class="logo">
            <div class="logo-icon">📁</div>
            <span>OrdnerSystem</span>
        </div>

        <div class="auth-title" id="authTitle">
            Willkommen zurück
        </div>

        <div class="auth-subtitle" id="authSubtitle">
            Melde dich an, um deine Ordner und Chips zu verwalten.
        </div>

        <form id="authForm" class="auth-form">

            <div class="field">
                <label>E-Mail</label>
                <input
                    id="authEmail"
                    type="email"
                    placeholder="name@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label>Passwort</label>
                <input
                    id="authPassword"
                    type="password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div
                class="field hidden"
                id="registerNameField"
            >
                <label>Name</label>
                <input
                    id="registerName"
                    type="text"
                    placeholder="Dein Name"
                >
            </div>

            <button
                class="primary-btn full"
                id="authSubmit"
                type="submit"
            >
                🔐 Anmelden
            </button>

        </form>

        <div class="auth-switch">
            <span id="authSwitchText">Noch kein Konto?</span>
            <button
                type="button"
                id="authSwitch"
            >
                Registrieren
            </button>
        </div>

    </div>

</section>


<!-- =========================
     APP
========================= -->

<section id="appScreen" class="hidden">

<div class="app-layout">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">

            <div class="sidebar-logo">
                <div class="sidebar-logo-icon">📁</div>
                <span>OrdnerSystem</span>
            </div>

        </div>

        <nav class="nav">

            <div class="nav-section">
                Übersicht
            </div>

            <button
                class="nav-item active"
                data-page="dashboard"
            >
                <span class="nav-icon">📊</span>
                Dashboard
            </button>

            <button
                class="nav-item"
                data-page="folders"
            >
                <span class="nav-icon">📁</span>
                Ordner
            </button>

            <button
                class="nav-item"
                data-page="categories"
            >
                <span class="nav-icon">🗂️</span>

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function formatDate(timestamp){

    if(!timestamp){
        return "Noch nicht";
    }

    try{

        const date =
            timestamp.toDate
                ? timestamp.toDate()
                : new Date(timestamp);

        return date.toLocaleString(
            "de-DE",
            {
                dateStyle:"medium",
                timeStyle:"short"
            }
        );

    }catch{

        return "Noch nicht";

    }
}


function makeChipId(){

    return (
        "CHIP-" +
        Math.random()
            .toString(36)
            .slice(2,8)
            .toUpperCase() +
        "-" +
        Date.now()
            .toString(36)
            .toUpperCase()
    );
}


function friendlyFirebaseError(error){

    const code =
        error?.code || "";

    if(code.includes("permission-denied")){
        return "Keine Berechtigung. Prüfe deine Firestore Rules.";
    }

    if(code.includes("email-already-in-use")){
        return "Diese E-Mail wird bereits verwendet.";
    }

    if(code.includes("invalid-credential")){
        return "E-Mail oder Passwort ist falsch.";
    }

    if(code.includes("weak-password")){
        return "Das Passwort ist zu schwach.";
    }

    if(code.includes("network")){
        return "Netzwerkfehler. Prüfe deine Internetverbindung.";
    }

    return error?.message || "Unbekannter Firebase-Fehler.";
}

            : "Noch kein Konto?";

    $("authSwitch").textContent =
        registerMode
            ? "Anmelden"
            : "Registrieren";
}


$("authSwitch")
.addEventListener(
    "click",
    () => {

        registerMode =
            !registerMode;

        updateAuthMode();

    }
);


$("authForm")
.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const email =
            $("authEmail")
                .value
                .trim();

        const password =
            $("authPassword")
                .value;

        if(!email || !password){

            toast(
                "Bitte E-Mail und Passwort eingeben.",
                "error"
            );

            return;
        }

        const button =
            $("authSubmit");

        button.disabled = true;

        try{

            if(registerMode){

                const name =
                    $("registerName")
                        .value
                        .trim();

                const credential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                if(name){

                    await updateProfile(
                        credential.user,
                        {
                            displayName:name
                        }
                    );

                }

                await setDoc(
                    doc(
                        db,
                        "users",
                        credential.user.uid
                    ),
                    {
                        uid:credential.user.uid,
                        email,
                        name:name || email.split("@")[0],
                        admin:false,
                        createdAt:serverTimestamp()
                    },
                    {
                        merge:true
                    }
                );

                toast(
                    "Konto erfolgreich erstellt.",
                    "success"
                );

            }else{

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                toast(
                    "Anmeldung erfolgreich.",
                    "success"
                );

            }

        }catch(error){

            console.error(error);

            toast(
                friendlyFirebaseError(error),
                "error"
            );

        }finally{

            button.disabled = false;

        }

    }
);

async function ensureUserDocument(){

    if(!currentUser){
        return;
    }

    try{

        await setDoc(
            doc(
                db,
                "users",
                currentUser.uid
            ),
            {
                uid:currentUser.uid,
                email:currentUser.email || "",
                name:
                    currentUser.displayName ||
                    currentUser.email?.split("@")[0] ||
                    "Benutzer",
                admin:isAdmin,
                updatedAt:serverTimestamp()
            },
            {
                merge:true
            }
        );

    }catch(error){

function stopListeners(){

    unsubscribers.forEach(
        unsubscribe => {

            try{
                unsubscribe();
            }catch{}

        }
    );

    unsubscribers = [];
}


function subscribeData(){

    stopListeners();

    /* FOLDERS */

    const folderQuery =
        query(
            collection(db,"folders"),
            orderBy("createdAt","desc")
        );

    unsubscribers.push(

        onSnapshot(
            folderQuery,
            snapshot => {

                folders =
                    snapshot.docs.map(
                        item => ({
                            id:item.id,
                            ...item.data()
                        })
                    );

                renderPage();

                handleFolderUrl();

            error => {

/* =========================================================
   CHIP LINK
========================================================= */

function getChipLink(folder){

    const url =
        new URL(
            window.location.href
        );

    url.search = "";
    url.hash = "";

    url.searchParams.set(
        "folder",
        folder.chipId || folder.id
    );

    return url.toString();

}


async function copyChipLink(id){

    const folder =
        folders.find(
            item =>
                item.id === id
        );

    if(!folder){
        return;
    }

    if(!folder.chipId){

        toast(
            "Dieser Ordner hat noch keine Chip-ID.",
            "warning"
        );

        return;
    }

    const link =
        getChipLink(folder);

    try{

        await navigator.clipboard.writeText(
            link
        );

        toast(
            "🔗 Chip-Link kopiert.",
            "success"
        );

    }catch{

        const area =
            document.createElement("textarea");

        area.value =
            link;

        document.body.appendChild(area);

        area.select();

        document.execCommand(
            "copy"
        );

        area.remove();

        toast(
            "🔗 Chip-Link kopiert.",
            "success"
        );

    }

}

                </button>

async function scanChip(chipId){

    if(!currentUser){

        toast(
            "Bitte zuerst anmelden.",
            "error"
        );

        return;

    }

    if(!chipId){

        toast(
            "Keine Chip-ID gefunden.",
            "error"
        );

        return;
    }

    const cleaned =
        decodeURIComponent(
            chipId
        ).trim();

    let folder =
        folders.find(
            item =>
                item.chipId === cleaned ||
                item.id === cleaned
        );

    if(!folder){

        toast(
            "❌ Kein Ordner zu diesem Chip gefunden.",
            "error"
        );

        return;
    }

    try{

        const folderRef =
            doc(
                db,
                "folders",
                folder.id
            );

        let newState =
            false;

        await runTransaction(
            db,
            async transaction => {

                const snapshot =
                    await transaction.get(
                        folderRef
                    );

                if(!snapshot.exists()){

                    throw new Error(
                        "Der Ordner existiert nicht mehr."
                    );

                }

                const data =
                    snapshot.data();

                const currentState =
                    data.chipActive === true;

                newState =
                    !currentState;

                transaction.update(
                    folderRef,
                    {

                        chipActive:
                            newState,

                        lastChipScan:
                            serverTimestamp(),

                        lastChipScanBy:
                            currentUser.uid,

                        updatedAt:
                            serverTimestamp()

                    }
                );

            }
        );

        closeModal();

        if(newState){

            toast(
                "🟢 " +
                folder.name +
                " wurde aktiviert.",
                "success"
            );

        }else{

            toast(
                "🔴 " +
                folder.name +
                " wurde deaktiviert.",
                "warning"
            );

        }

        openPage("folders");

    }catch(error){

        console.error(
            "Chip scan:",
            error
        );

        toast(
            "Chip konnte nicht verarbeitet werden: " +
            friendlyFirebaseError(error),
            "error"
        );

    }

}


/* =========================================================
   URL CHIP AUTO SCAN
========================================================= */

function handleFolderUrl(){

    if(autoScanDone){
        return;
    }

    const params =
        new URLSearchParams(
            window.location.search
        );

    const chip =
        params.get("folder");

    if(!chip){
        return;
    }

    const folder =
        folders.find(
            item =>
                item.chipId === chip ||
                item.id === chip
        );

    if(!folder){
        return;
    }

    autoScanDone = true;

    scanChip(chip);

}

                                        ${formatDate(
                                            notification.createdAt
                                        )}
                                    </div>

                                </div>

                                `
                            )
                            .join("")
                        : renderEmpty(
                            "🔔",
                            "Keine Benachrichtigungen",
                            "Du bist auf dem neuesten Stand."
                        )
                }

            </div>

        </div>

    `;

}

async function saveProfile(){

    const name =
        $("profileName")
            ?.value
            .trim();

    if(!name){

        toast(
            "Bitte einen Namen eingeben.",
            "error"
        );

        return;
    }

    try{

        await updateProfile(
            currentUser,
            {
                displayName:name
            }
        );

        await updateDoc(
            doc(
                db,
                "users",
                currentUser.uid
            ),
            {
                name,
                updatedAt:
                    serverTimestamp()
            }
        );

        updateUserUI();

        toast(
            "Profil gespeichert.",
            "success"
        );

    }catch(error){

        console.error(error);

        toast(
            "Profil konnte nicht gespeichert werden: " +
            friendlyFirebaseError(error),
            "error"
        );

    }

}

/* =========================================================
   MODAL
========================================================= */

function openModal(
    title,
    body,
    buttonText = "Speichern",
    handler = null,
    showSave = true
){

    $("modalTitle").textContent =
        title;

    $("modalBody").innerHTML =
        body;

    $("modalSave").textContent =
        buttonText;

    $("modalSave").style.display =
        showSave
            ? "inline-flex"
            : "none";

    modalHandler =
        handler;

    $("modalOverlay")
        .classList
        .add("show");

}


function closeModal(){

    $("modalOverlay")
        .classList
        .remove("show");

    $("modalBody").innerHTML =
        "";

    modalHandler =
        null;

    editingId =
        null;

}


/* Modal submit */

$("modalForm")
.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        if(
            typeof modalHandler !==
            "function"
        ){

            closeModal();

            return;
        }

        const handler =
            modalHandler;

        try{

            await handler();

        }catch(error){

            console.error(error);

        }

    }
);


/* Modal outside click */

$("modalOverlay")
.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            $("modalOverlay")
        ){

            closeModal();

        }

    }
);


/* =========================================================
   GLOBAL ACTION HANDLER
========================================================= */

async function handleAction(
    action,
    element
){

    const id =
        element?.dataset?.id;

    switch(action){

        case "logout":

            await signOut(auth);

            break;


        case "add-folder":

            openAddFolder();

            break;


        case "edit-folder":

            openEditFolder(id);

            break;


        case "delete-folder":

            await deleteFolder(id);

            break;


        case "open-folder":

            openFolder(id);

            break;


        case "copy-chip":

            await copyChipLink(id);

            break;


        case "scan":

            openScan();

            break;


        case "manual-scan":{

            const value =
                $("manualChip")
                    ?.value
                    .trim();

            if(!value){

                toast(
                    "Bitte Chip-ID oder Link eingeben.",
                    "error"
                );

                return;
            }

            let chipId =
                value;

            try{

                const url =
                    new URL(value);

                chipId =
                    url.searchParams.get("folder") ||
                    value;

            }catch{}

            await scanChip(chipId);

            break;

        }


        case "add-category":

            openAddCategory();

            break;


        case "edit-category":

            openEditCategory(id);

            break;


        case "delete-category":

            await deleteCategory(id);

            break;


        case "save-profile":

            await saveProfile();

            break;


        case "toggle-theme":

            toggleTheme();

            break;


        case "close-modal":

            closeModal();

            break;

    }

}


/* =========================================================
   SEARCH
========================================================= */

$("globalSearch")
.addEventListener(
    "input",
    event => {

        const value =
            event.target.value
                .trim()
                .toLowerCase();

        if(!value){

            renderPage();

            return;
        }

        if(
            activePage ===
            "folders"
        ){

            const filtered =
                folders.filter(
                    folder =>
                        String(
                            folder.name || ""
                        )
                        .toLowerCase()
                        .includes(value) ||

                        String(
                            folder.category || ""
                        )
                        .toLowerCase()
                        .includes(value) ||

                        String(
                            folder.chipId || ""
                        )
                        .toLowerCase()
                        .includes(value)
                );

            $("pageContainer")
                .innerHTML = `

                    <div class="page-header">

                        <div>

                            <div class="page-title">
                                🔍 Suche
                            </div>

                            <div class="page-subtitle">
                                Ergebnisse für „${escapeHtml(value)}“
                            </div>

                        </div>

                    </div>


                    ${
                        filtered.length
                            ? `
                                <div class="folder-grid">
                                    ${filtered
                                        .map(renderFolderCard)
                                        .join("")}
                                </div>
                            `
                            : renderEmpty(
                                "🔍",
                                "Nichts gefunden",
                                "Kein Ordner passt zu deiner Suche."
                            )
                    }

                `;

        }else{

            openPage("folders");

            event.target.value =
                value;

            setTimeout(
                () => {

                    event.target.dispatchEvent(
                        new Event("input")
                    );

                },
                0
            );

        }

    }
);

/* =========================================================
   THEME
========================================================= */

function loadTheme(){

    const theme =
        localStorage.getItem(
            "ordnersystem-theme"
        );

    if(theme === "dark"){

        document.body
            .classList
            .add("dark");

    }

}


function toggleTheme(){

    document.body
        .classList
        .toggle("dark");

    localStorage.setItem(
        "ordnersystem-theme",
        document.body
            .classList
            .contains("dark")
            ? "dark"
            : "light"
    );

}


loadTheme();


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape" &&
            $("modalOverlay")
                .classList
                .contains("show")
        ){

            closeModal();

        }

    }
);
