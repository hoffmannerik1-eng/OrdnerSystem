function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function firebaseError(error){

    const code =
        error?.code || "";

    const messages = {

        "auth/invalid-credential":
            "E-Mail oder Passwort ist falsch.",

        "auth/email-already-in-use":
            "Diese E-Mail-Adresse wird bereits verwendet.",

        "auth/weak-password":
            "Das Passwort ist zu schwach.",

        "auth/invalid-email":
            "Die E-Mail-Adresse ist ungültig.",

        "permission-denied":
            "Du hast keine Berechtigung für diese Aktion.",

        "failed-precondition":
            "Die Aktion kann momentan nicht durchgeführt werden.",

        "not-found":
            "Der Ordner wurde nicht gefunden."

    };

    return messages[code] ||
           error?.message ||
           "Unbekannter Fehler.";
}


function showToast(title,text,type="info"){

    const toast =
        document.createElement("div");

    toast.className =
        `toast ${type}`;

    toast.innerHTML = `

        <div class="toast-title">
            ${escapeHtml(title)}
        </div>

        <div class="toast-text">
            ${escapeHtml(text)}
        </div>
    `;

    $("toastContainer").appendChild(toast);

    setTimeout(()=>{

        toast.remove();

    },4500);
}


function formatDate(timestamp){

    if(!timestamp){
        return "Noch nicht";
    }

    let date;

    try{

        if(timestamp.toDate){
            date = timestamp.toDate();
        }else{
            date = new Date(timestamp);
        }

    }catch{
        return "Unbekannt";
    }

    if(Number.isNaN(date.getTime())){
        return "Unbekannt";
    }

    return date.toLocaleString(
        "de-DE",
        {
            dateStyle:"short",
            timeStyle:"short"
        }
    );
}

function startRealtimeListeners(){

    stopRealtimeListeners();


    unsubscribeFolders =
        onSnapshot(
            collection(db,"folders"),
            snapshot=>{

                folders =
                    snapshot.docs.map(
                        item=>({
                            id:item.id,
                            ...item.data()
                        })
                    );

                renderCurrentPage();
            },
            error=>{

                console.error(error);

                showToast(
                    "Ordner konnten nicht geladen werden",
                    firebaseError(error),
                    "error"
                );
            }
        );


    unsubscribeUsers =
        onSnapshot(
            collection(db,"users"),
            snapshot=>{

                users =
                    snapshot.docs.map(
                        item=>({
                            id:item.id,
                            ...item.data()
                        })
                    );

                renderCurrentPage();
            }
        );


    unsubscribeCategories =
        onSnapshot(
            collection(db,"categories"),
            snapshot=>{

                categories =
                    snapshot.docs.map(
                        item=>({
                            id:item.id,
                            ...item.data()
                        })
                    );

                renderCurrentPage();
            }
        );


    unsubscribeRequests =
        onSnapshot(
            collection(db,"requests"),
            snapshot=>{

                requests =
                    snapshot.docs.map(
                        item=>({
                            id:item.id,
                            ...item.data()
                        })
                    );

                renderCurrentPage();
            }
        );
}


function stopRealtimeListeners(){

    if(unsubscribeFolders){
        unsubscribeFolders();
        unsubscribeFolders = null;
    }

    if(unsubscribeUsers){
        unsubscribeUsers();
        unsubscribeUsers = null;
    }

    if(unsubscribeCategories){
        unsubscribeCategories();
        unsubscribeCategories = null;
    }

    if(unsubscribeRequests){
        unsubscribeRequests();
        unsubscribeRequests = null;
    }
}

/* =========================================
   IMPORTANT:
   NFC URL HANDLER
========================================= */

async function handleNfcLink(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const folderId =
        params.get("folder");

    const chipId =
        params.get("chip");


    /*
       Der NFC-Chip kann entweder

       https://deine-seite.de/?folder=ORDNER_ID

       oder

       https://deine-seite.de/?chip=CHIP_ID

       öffnen.
    */

    if(!folderId && !chipId){
        return;
    }


    let folder = null;


    if(folderId){

        folder =
            folders.find(
                item => item.id === folderId
            );

        /*
           Falls die Realtime-Daten noch nicht geladen
           sind, direkt aus Firestore laden.
        */

        if(!folder){

            try{

                const snapshot =
                    await getDoc(
                        doc(
                            db,
                            "folders",
                            folderId
                        )
                    );

                if(snapshot.exists()){

                    folder = {
                        id:snapshot.id,
                        ...snapshot.data()
                    };

                }

            }catch(error){

                console.error(error);

            }
        }

    }


    /*
       Alternative:
       NFC-Link enthält ?chip=CHIP-ID
    */

    if(!folder && chipId){

        try{

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "folders"
                    )
                );

            const found =
                snapshot.docs.find(
                    item =>
                        item.data().chipId === chipId
                );

            if(found){

                folder = {
                    id:found.id,
                    ...found.data()
                };

            }

        }catch(error){

            console.error(error);
        }
    }


    /*
       URL aufräumen.
       Dadurch bleibt nach dem Scan nicht dauerhaft
       ?folder=... in der Adresszeile.
    */

    try{

        window.history.replaceState(
            {},
            document.title,
            window.location.pathname +
            window.location.hash
        );

    }catch{}


    if(!folder){

        showToast(
            "Ordner nicht gefunden",
            "Der NFC-Chip ist keinem bekannten Ordner zugeordnet.",
            "error"
        );

        return;
    }


    /*
       Der eigentliche NFC-Vorgang.
    */

    await scanFolderTransaction(
        folder.id
    );


    /*
       Schöne Ergebnis-Seite.
    */

    await showNfcResult(folder.id);
}


/* =========================================
   NFC TRANSACTION
========================================= */

async function scanFolderTransaction(
    folderId
){

    if(!currentUser){

        showToast(
            "Anmeldung erforderlich",
            "Bitte zuerst anmelden.",
            "error"
        );

        return null;
    }


    const folderRef =
        doc(
            db,
            "folders",
            folderId
        );


    try{

        const result =
            await runTransaction(
                db,
                async transaction=>{

                    const snapshot =
                        await transaction.get(
                            folderRef
                        );


                    if(!snapshot.exists()){

                        throw new Error(
                            "Ordner wurde nicht gefunden."
                        );
                    }


                    const folder =
                        snapshot.data();


                    const uid =
                        currentUser.uid;


                    const name =
                        currentUser.displayName ||
                        currentUser.email ||
                        "Benutzer";


                    const isTaken =
                        folder.chipActive === true;


                    const holder =
                        folder.heldByUid ||
                        null;


                    /*
                       FALL 1:
                       Ordner ist frei.

                       Der aktuelle Benutzer übernimmt ihn.
                    */

                    if(!isTaken){

                        transaction.update(
                            folderRef,
                            {

                                chipActive:true,

                                heldByUid:uid,

                                heldByName:name,

                                lastScannedByUid:uid,

                                lastScannedByName:name,

                                lastScannedAt:
                                    serverTimestamp()
                            }
                        );


                        return {

                            action:"taken",

                            folderName:
                                folder.name ||
                                "Ordner"
                        };
                    }


                    /*
                       FALL 2:
                       Ordner ist rot und gehört jemand anderem.

                       NICHTS ändern.
                    */

                    if(holder !== uid){

                        return {

                            action:"blocked",

                            folderName:
                                folder.name ||
                                "Ordner",

                            holder:
                                folder.heldByName ||
                                "anderer Benutzer"
                        };
                    }


                    /*
                       FALL 3:
                       Derselbe Benutzer scannt erneut.

                       Ordner wird wieder frei.
                    */

                    transaction.update(
                        folderRef,
                        {

                            chipActive:false,

                            heldByUid:null,

                            heldByName:null,

                            lastScannedByUid:uid,

                            lastScannedByName:name,

                            lastScannedAt:
                                serverTimestamp()
                        }
                    );


                    return {

                        action:"released",

                        folderName:
                            folder.name ||
                            "Ordner"
                    };

                }
            );


        if(result.action === "taken"){

            showToast(
                "🔴 Ordner übernommen",
                `${result.folderName} ist jetzt bei dir.`,
                "error"
            );
        }


        if(result.action === "released"){

            showToast(
                "🟢 Ordner freigegeben",
                `${result.folderName} ist wieder frei.`,
                "success"
            );
        }


        if(result.action === "blocked"){

            showToast(
                "🔴 Bereits belegt",
                `${result.folderName} wird bereits von ${result.holder} verwendet.`,
                "error"
            );
        }


        return result;


    }catch(error){

        console.error(
            "NFC transaction error:",
            error
        );


        showToast(
            "Scan fehlgeschlagen",
            firebaseError(error),
            "error"
        );


        return null;
    }
}


/* =========================================
   NFC RESULT
========================================= */

async function showNfcResult(
    folderId
){

    let folder =
        folders.find(
            item => item.id === folderId
        );


    if(!folder){

        try{

            const snapshot =
                await getDoc(
                    doc(
                        db,
                        "folders",
                        folderId

                );

                folder = {
                    id:snapshot.id,
                    ...snapshot.data()
                };

            }

        }catch{}
    }


    if(!folder){

        return;

    const busy =
        folder.chipActive === true;

    const mine =
        busy &&
        folder.heldByUid ===
            currentUser.uid;


    $("pageContent").innerHTML = `

                            <div>
                                ${
                                    mine
                                    ? "Dieser Ordner ist jetzt bei dir."
                                    : `
                                        Dieser Ordner wird gerade
                                        von <strong>
                                        ${escapeHtml(
                                            folder.heldByName ||
                                            "einem anderen Benutzer"
                                        )}
                                        </strong> verwendet.
                                    `
                                }
                            </div>

                        `
                        : `

                            <h2>
                                🟢 Frei
                            </h2>

                            <div>
                                Der Ordner ist wieder frei

                <div style="

window.saveFolder =
async function(folderId){

    const name =
        $("modalFolderName")
            .value
            .trim();

    const category =
        $("modalFolderCategory")
            .value
            .trim();

    const chipId =
        $("modalFolderChip")
            .value
            .trim();

    const description =
        $("modalFolderDescription")
            .value
            .trim();


    if(!name){

        showToast(
            "Name fehlt",
            "Bitte einen Ordnernamen eingeben.",
            "error"
        );

        return;
    }


    try{

        /*
           Chip-ID darf nicht doppelt vorkommen.
        */

        if(chipId){

            const duplicate =
                folders.find(
                    item =>
                        item.chipId === chipId &&
                        item.id !== folderId
                );

            if(duplicate){

                showToast(
                    "Chip bereits vergeben",
                    "Diese NFC-Chip-ID gehört bereits zu einem anderen Ordner.",
                    "error"
                );

                return;
            }
        }


        if(folderId){

            await updateDoc(
                doc(
                    db,
                    "folders",
                    folderId
                ),
                {

                    name:name,

                    category:
                        category || "Allgemein",

                    chipId:chipId || null,

                    description:
                        description || "",

                    updatedAt:
                        serverTimestamp()
                }
            );


            showToast(
                "Gespeichert",
                "Der Ordner wurde aktualisiert.",
                "success"
            );

        }else{

            await addDoc(
                collection(
                    db,
                    "folders"
                ),
                {

                    name:name,

                    category:
                        category || "Allgemein",

                    chipId:
                        chipId || null,

                    description:
                        description || "",

                    chipActive:false,

                    heldByUid:null,

                    heldByName:null,

                    createdBy:
                        currentUser.uid,

                    createdByName:
                        userName(),

                    createdAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()
                }
            );


            showToast(
                "Ordner erstellt",
                "Der neue Ordner wurde angelegt.",
                "success"
            );
        }


        closeModal();


    }catch(error){

        console.error(error);

        showToast(
            "Speichern fehlgeschlagen",
            firebaseError(error),
            "error"
        );
    }
};
