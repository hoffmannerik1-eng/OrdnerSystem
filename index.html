<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrdnerSystem</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 92%;
            max-width: 500px;
            background: rgba(20, 25, 35, 0.96);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 7px 0;
            border: 0;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .plus {
            font-size: 30px;
            width: 60px;
            height: 60px;
            padding: 0;
            border-radius: 50%;
        }

        .person {
            background: #1f2937;
            padding: 15px;
            margin-top: 12px;
            border-radius: 12px;
            text-align: left;
        }

        .status {
            color: #22c55e;
            font-weight: bold;
        }

        .aktionen {
            display: flex;
            gap: 8px;
        }

        .aktionen button {
            margin-top: 10px;
            padding: 10px;
        }

        .bearbeiten {
            background: #f59e0b;
        }

        .loeschen {
            background: #dc2626;
        }

        #fehler {
            color: #ff5555;
        }

        #admin {
            display: none;
        }

        #formular {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div class="box" id="login">
        <h1>🔐 OrdnerSystem</h1>

        <input id="email" type="email" placeholder="E-Mail">
        <input id="passwort" type="password" placeholder="Passwort">

        <button onclick="anmelden()">ANMELDEN</button>

        <p id="fehler"></p>
    </div>


    <!-- ADMIN -->
    <div class="box" id="admin">

        <h1>⚙️ OrdnerSystem</h1>

        <h2>Personen & NFC-Chips</h2>

        <button class="plus" onclick="formularAnzeigen()">+</button>

        <div id="formular">

            <input id="name" type="text" placeholder="Name der Person">

            <input id="chip" type="text" placeholder="NFC-Chip-ID">

            <button id="speichernButton" onclick="personHinzufuegen()">
                Person hinzufügen
            </button>

        </div>

        <div id="personen"></div>

        <button onclick="abmelden()">ABMELDEN</button>

    </div>


    <script type="module">

        import { initializeApp } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

        import {
            getFirestore,
            collection,
            addDoc,
            onSnapshot,
            query,
            orderBy,
            doc,
            updateDoc,
            deleteDoc
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        const firebaseConfig = {
            apiKey: "AIzaSyAYD56NLKpXVGAZ31807UQh9sSB-kncBjk",
            authDomain: "ordnersystem-1352a.firebaseapp.com",
            projectId: "ordnersystem-1352a",
            storageBucket: "ordnersystem-1352a.firebasestorage.app",
            messagingSenderId: "39473536985",
            appId: "1:39473536985:web:7dae48028c28dabc6a03c8"
        };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);


        let bearbeitetePerson = null;


        // LOGIN
        window.anmelden = async function () {

            const email =
                document.getElementById("email").value;

            const passwort =
                document.getElementById("passwort").value;

            const fehler =
                document.getElementById("fehler");

            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    passwort
                );

                fehler.textContent = "";

            } catch (error) {

                fehler.textContent =
                    "E-Mail oder Passwort falsch.";
            }
        };


        // LOGOUT
        window.abmelden = async function () {
            await signOut(auth);
        };


        // FORMULAR
        window.formularAnzeigen = function () {

            const formular =
                document.getElementById("formular");

            if (formular.style.display === "block") {

                formular.style.display = "none";

            } else {

                formular.style.display = "block";

                bearbeitetePerson = null;

                document.getElementById("name").value = "";
                document.getElementById("chip").value = "";

                document.getElementById("speichernButton")
                    .textContent = "Person hinzufügen";
            }
        };


        // PERSON HINZUFÜGEN / BEARBEITEN
        window.personHinzufuegen = async function () {

            const name =
                document.getElementById("name").value.trim();

            const chip =
                document.getElementById("chip").value.trim();

            if (name === "" || chip === "") {

                alert("Bitte Name und Chip-ID eingeben.");

                return;
            }


            try {

                // BEARBEITEN
                if (bearbeitetePerson) {

                    await updateDoc(
                        doc(db, "chips", bearbeitetePerson),
                        {
                            name: name,
                            chipId: chip
                        }
                    );

                    bearbeitetePerson = null;

                }

                // NEU
                else {

                    await addDoc(
                        collection(db, "chips"),
                        {
                            name: name,
                            chipId: chip
                        }
                    );
                }


                document.getElementById("name").value = "";
                document.getElementById("chip").value = "";

                document.getElementById("formular").style.display = "none";

                document.getElementById("speichernButton")
                    .textContent = "Person hinzufügen";


            } catch (error) {

                console.error(error);

                alert("Fehler beim Speichern.");
            }
        };


        // BEARBEITEN
        window.personBearbeiten = function (id, name, chip) {

            bearbeitetePerson = id;

            document.getElementById("name").value = name;

            document.getElementById("chip").value = chip;

            document.getElementById("formular").style.display = "block";

            document.getElementById("speichernButton")
                .textContent = "Änderungen speichern";
        };


        // LÖSCHEN
        window.personLoeschen = async function (id, name) {

            const sicher =
                confirm(
                    "Soll " + name + " wirklich gelöscht werden?"
                );

            if (!sicher) return;


            try {

                await deleteDoc(
                    doc(db, "chips", id)
                );

            } catch (error) {

                console.error(error);

                alert("Fehler beim Löschen.");
            }
        };


        // PERSONEN LADEN
        function personenLaden() {

            const personen =
                document.getElementById("personen");

            const chipsQuery =
                query(
                    collection(db, "chips"),
                    orderBy("name")
                );


            onSnapshot(chipsQuery, (snapshot) => {

                personen.innerHTML = "";


                snapshot.forEach((chipDokument) => {

                    const daten =
                        chipDokument.data();

                    const id =
                        chipDokument.id;


                    const neuePerson =
                        document.createElement("div");

                    neuePerson.className = "person";


                    const name =
                        document.createElement("strong");

                    name.textContent =
                        daten.name;


                    const chip =
                        document.createElement("div");

                    chip.textContent =
                        "Chip: " + daten.chipId;


                    const status =
                        document.createElement("div");

                    status.innerHTML =
                        'Status: <span class="status">● Frei</span>';


                    const aktionen =
                        document.createElement("div");

                    aktionen.className = "aktionen";


                    const bearbeiten =
                        document.createElement("button");

                    bearbeiten.textContent = "✏️ Bearbeiten";

                    bearbeiten.className = "bearbeiten";

                    bearbeiten.onclick = function () {

                        personBearbeiten(
                            id,
                            daten.name,
                            daten.chipId
                        );

                    };


                    const loeschen =
                        document.createElement("button");

                    loeschen.textContent = "🗑️ Löschen";

                    loeschen.className = "loeschen";

                    loeschen.onclick = function () {

                        personLoeschen(
                            id,
                            daten.name
                        );

                    };


                    aktionen.appendChild(bearbeiten);
                    aktionen.appendChild(loeschen);


                    neuePerson.appendChild(name);
                    neuePerson.appendChild(
                        document.createElement("br")
                    );
                    neuePerson.appendChild(chip);
                    neuePerson.appendChild(status);
                    neuePerson.appendChild(aktionen);


                    personen.appendChild(neuePerson);

                });

            });
        }


        // LOGIN STATUS
        onAuthStateChanged(auth, (user) => {

            if (user) {

                document.getElementById("login")
                    .style.display = "none";

                document.getElementById("admin")
                    .style.display = "block";

                personenLaden();

            } else {

                document.getElementById("login")
                    .style.display = "block";

                document.getElementById("admin")
                    .style.display = "none";
            }

        });

    </script>

</body>
</html>
